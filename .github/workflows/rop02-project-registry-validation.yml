name: ROP02 Project Registry Validation
on:
  push:
    branches:
      - feat/rop02-el-fierro-20261019
      - feat/rop02-dynamic-catalog-20261020
      - feat/control-rop02-rop05-proyectos-a-considerar-20261020
      - feat/calidad-ichc-proyectos-dinamicos-20261020
      - fix/rop02-control-errores-corte-26-25-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source file imports
        run: node scripts/validate-local-imports.mjs
      - name: Static and syntax checks
        run: npm run check
      - name: Regression tests
        run: npm run validate
      - name: Build
        run: npm run build
