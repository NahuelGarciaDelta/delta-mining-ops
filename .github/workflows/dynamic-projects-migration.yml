name: Dynamic projects migration

on:
  push:
    paths:
      - '.github/workflows/dynamic-projects-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Centralize project normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # shared/domain: conservar API existente pero delegar al normalizador dinámico.
          path=Path('src/shared/domain/index.jsx')
          s=path.read_text(encoding='utf-8')
          imp='import { normalizeProjectName } from "../projects.js";\n'
          if imp not in s:
              anchor='import { cleanEquipmentCode, isMaintenanceCostMachine, maintenanceCostTypeFromFamily } from "../../modules/equipment/equipmentCode.js";\n'
              if anchor not in s: raise SystemExit('No se encontró anchor domain import')
              s=s.replace(anchor,anchor+imp,1)
          pattern=r'function dmNormalizeProject\(v\)\{.*?\n\}'
          repl='function dmNormalizeProject(v){return normalizeProjectName(v);}'
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se pudo reemplazar dmNormalizeProject')
          path.write_text(s,encoding='utf-8')

          # Home/Atraso/Disponibilidad: misma normalización, sin asumir que todo FILO es FDS.
          path=Path('src/modules/home/homeAvailability.js')
          s=path.read_text(encoding='utf-8')
          imp='import { normalizeProjectName } from "../../shared/projects.js";\n\n'
          if not s.startswith('import { normalizeProjectName'):
              s=imp+s
          pattern=r'export function normalizeRop02Project\(value\)\{.*?\n\}'
          repl='export function normalizeRop02Project(value){return normalizeProjectName(value,{empty:""});}'
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se pudo reemplazar normalizeRop02Project')
          path.write_text(s,encoding='utf-8')

          # UI / permisos por proyecto: usar la misma semántica para proyectos futuros.
          path=Path('src/components/ui/index.jsx')
          s=path.read_text(encoding='utf-8')
          imp='import { normalizeProjectName } from "../../shared/projects.js";\n'
          if imp not in s:
              anchor='import { SafeTooltipHtml } from "../../shared/safeTooltip.jsx";\n'
              if anchor not in s: raise SystemExit('No se encontró anchor ui import')
              s=s.replace(anchor,anchor+imp,1)
          pattern=r'export function dmNormalizeAssignedProject\(v\)\{.*?\n\}'
          repl='export function dmNormalizeAssignedProject(v){\n  const normalized=normalizeProjectName(v,{empty:"TODO"});\n  return ["TODO","TODOS","ALL"].includes(normalized)?"TODO":normalized;\n}'
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se pudo reemplazar dmNormalizeAssignedProject')
          path.write_text(s,encoding='utf-8')

          # Test unitario mínimo del contrato de proyectos futuros.
          test=Path('tests/projects.test.mjs')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport {normalizeProjectName,collectProjects,projectMatches} from "../src/shared/projects.js";\n\ntest("normaliza aliases conocidos sin absorber proyectos futuros",()=>{\n  assert.equal(normalizeProjectName("JM"),"JOSE MARIA");\n  assert.equal(normalizeProjectName("FDS"),"FILO DEL SOL");\n  assert.equal(normalizeProjectName("Filo Norte"),"FILO NORTE");\n  assert.equal(normalizeProjectName("Proyecto Andino"),"PROYECTO ANDINO");\n});\n\ntest("descubre proyectos nuevos desde datasets",()=>{\n  const found=collectProjects([{proyecto:"JM"},{proyecto:"Proyecto Andino"}],[{lugar:"Filo Norte"}]);\n  assert.deepEqual(found,["FILO NORTE","JOSE MARIA","PROYECTO ANDINO"]);\n  assert.equal(projectMatches("jm","José María"),true);\n});\n''',encoding='utf-8')

          # El workflow es de un solo uso.
          Path('.github/workflows/dynamic-projects-migration.yml').unlink(missing_ok=True)
          PY
      - name: Validate
        run: npm ci && npm run validate
      - name: Commit
        run: |
          git config user.name "Delta Mining OPS Automation"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Normalizar soporte dinámico de proyectos"
          git push origin HEAD:main
