name: Validate historical Abastecimiento allocation

on:
  push:
    branches: [fix/abastecimiento-historical-key-20260914]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply historical allocation source patch
        run: node scripts/apply-abastecimiento-historical-key.mjs
      - name: Regression tests
        run: node --test tests/abastecimiento-allocation-regression.test.mjs tests/enviosSinSolicitud.test.mjs
      - name: Validate against current Supabase snapshot
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const api=fs.readFileSync('src/services/raba03ReadApi.js','utf8');
          const url=(api.match(/https:\/\/[^"']+\.supabase\.co/)||[])[0];
          const key=(api.match(/sb_publishable_[A-Za-z0-9_-]+/)||[])[0];
          if(!url||!key) throw new Error('No se pudo leer URL/key pública de Supabase');

          const norm=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const normCode=v=>String(v??'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'').trim();
          const project=v=>{const t=norm(v);const c=t.replace(/\s+/g,'');if(t.includes('jose maria')||c.includes('josemaria'))return 'JOSE MARIA';if(t.includes('filo del sol')||c.includes('filodelsol'))return 'FILO DEL SOL';return String(v??'').trim().toUpperCase();};
          const dateMs=v=>{const s=String(v??'').trim();if(!s)return 0;const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]).getTime();const dm=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);if(dm){let y=+dm[3];if(y<100)y+=2000;return new Date(y,+dm[2]-1,+dm[1]).getTime();}const d=new Date(s);return Number.isNaN(d.getTime())?0:d.getTime();};
          const n=v=>{const x=Number(String(v??0).replace(/\./g,'').replace(',','.'));return Number.isFinite(x)?x:0;};

          const res=await fetch(url+'/rest/v1/rpc/abastecimiento_snapshot',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:'{}'});
          if(!res.ok) throw new Error('snapshot HTTP '+res.status+' '+(await res.text()).slice(0,160));
          const snap=await res.json();

          const rejected=new Set();
          const manualClosed=new Set();
          for(const e of (snap.estados||[])){
            const estado=String(e.ESTADO||'').toUpperCase();
            const k=String(e.CLAVE_SOLICITUD||'').trim();
            if(!k)continue;
            if(estado==='RECHAZADA')rejected.add(k);
            if(estado==='CERRADA_MANUAL')manualClosed.add(k);
          }

          const requests=(snap.raba03||[]).map((r,i)=>{
            const code=normCode(r['Código de articulo']||r['Código de artículo']);
            const p=project(r['Centro de Costo']);
            const ds=String(r['Fecha de solicitud']||'').slice(0,10);
            const pedido=String(r['N° de pedido']||r['N° de solicitud']||'').trim();
            const stable=[normCode(pedido),code,ds].join('|');
            return {i,code,p,date:dateMs(r['Fecha de solicitud']),qty:n(r['Cant. Solicitada']||r['Cantidad']),stable,sent:0};
          }).filter(r=>r.code&&r.p&&!rejected.has(r.stable));

          const byKey=new Map();
          for(const r of requests){const k=`${r.code}__${r.p}`;if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(r);}
          for(const q of byKey.values())q.sort((a,b)=>(a.date||0)-(b.date||0)||a.i-b.i);

          const shipments=(snap.remitos||[]).map((r,i)=>({
            i,
            code:normCode(r.CODIGO_ARTICULO),
            p:project(r.PROYECTO||r.OBSERVACIONES||r.DESTINO||r.ORIGEN),
            date:dateMs(r.FECHA_REMITO),
            qty:n(r.CANTIDAD_ENVIADA),
          })).filter(r=>r.code&&r.p&&r.qty>0).sort((a,b)=>(a.date||0)-(b.date||0)||a.i-b.i);

          let unmatchedLines=0,unmatchedQty=0;
          for(const s of shipments){
            let remain=s.qty;
            const q=byKey.get(`${s.code}__${s.p}`)||[];
            for(const r of q){
              if(remain<=0)break;
              // Regla definitiva: nunca consumir una solicitud futura.
              if(r.date&&s.date&&r.date>s.date)continue;
              const pending=Math.max(0,r.qty-r.sent);
              if(!pending)continue;
              const used=Math.min(pending,remain);
              r.sent+=used;
              remain-=used;
            }
            if(remain>0){unmatchedLines++;unmatchedQty+=remain;}
          }

          const pending=requests.filter(r=>r.sent<=0&&!manualClosed.has(r.stable)).length;
          const partial=requests.filter(r=>r.sent>0&&r.sent<r.qty&&!manualClosed.has(r.stable)).length;
          const closed=requests.filter(r=>r.qty>0&&(r.sent>=r.qty||manualClosed.has(r.stable))).length;
          const metrics={raba03:(snap.raba03||[]).length,remitoLines:shipments.length,rejected:rejected.size,pending,partial,closed,unmatchedLines,unmatchedQty};
          console.log('ABASTECIMIENTO_METRICS '+JSON.stringify(metrics));

          if(pending<150||pending>350)throw new Error('Pendientes fuera de rango de control esperado: '+pending);
          if(unmatchedLines<50)throw new Error('Envíos sin solicitud inesperadamente bajos: '+unmatchedLines);
          NODE
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/abastecimiento/AbastecimientoModule.jsx tests/abastecimiento-allocation-regression.test.mjs
          git rm scripts/apply-abastecimiento-historical-key.mjs .github/workflows/validate-abastecimiento-historical-key.yml
          git commit -m "fix: restore chronological code-project shipment allocation"
          git push origin HEAD:fix/abastecimiento-historical-key-20260914
