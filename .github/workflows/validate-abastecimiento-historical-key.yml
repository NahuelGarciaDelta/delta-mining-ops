name: Diagnose historical Abastecimiento allocation

on:
  push:
    branches: [fix/abastecimiento-historical-key-20260914]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply historical allocation source patch
        run: node scripts/apply-abastecimiento-historical-key.mjs
      - name: Regression tests
        run: node --test tests/abastecimiento-allocation-regression.test.mjs tests/enviosSinSolicitud.test.mjs
      - name: Diagnose current Supabase snapshot
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const api=fs.readFileSync('src/services/raba03ReadApi.js','utf8');
          const url=(api.match(/https:\/\/[^"']+\.supabase\.co/)||[])[0];
          const key=(api.match(/sb_publishable_[A-Za-z0-9_-]+/)||[])[0];
          const norm=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const normCode=v=>String(v??'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'').trim();
          const project=v=>{const t=norm(v),c=t.replace(/\s+/g,'');if(t.includes('jose maria')||c.includes('josemaria'))return 'JOSE MARIA';if(t.includes('filo del sol')||c.includes('filodelsol'))return 'FILO DEL SOL';return String(v??'').trim().toUpperCase();};
          const dateMs=v=>{const s=String(v??'').trim();if(!s)return 0;const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]).getTime();const dm=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);if(dm){let y=+dm[3];if(y<100)y+=2000;return new Date(y,+dm[2]-1,+dm[1]).getTime();}const d=new Date(s);return Number.isNaN(d.getTime())?0:d.getTime();};
          const n=v=>{const x=Number(String(v??0).replace(/\./g,'').replace(',','.'));return Number.isFinite(x)?x:0;};
          const res=await fetch(url+'/rest/v1/rpc/abastecimiento_snapshot',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:'{}'});
          if(!res.ok)throw new Error('snapshot HTTP '+res.status);
          const snap=await res.json();
          const rejected=new Set((snap.estados||[]).filter(e=>String(e.ESTADO||'').toUpperCase()==='RECHAZADA').map(e=>String(e.CLAVE_SOLICITUD||'').trim()));
          const requests=(snap.raba03||[]).map((r,i)=>{
            const code=normCode(r['Código de articulo']||r['Código de artículo']);
            const p=project(r['Centro de Costo']);
            const ds=String(r['Fecha de solicitud']||'').slice(0,10);
            const pedido=String(r['N° de pedido']||r['N° de solicitud']||'').trim();
            const stable=[normCode(pedido),code,ds].join('|');
            return {i,code,p,date:dateMs(r['Fecha de solicitud']),dateText:r['Fecha de solicitud'],qty:n(r['Cant. Solicitada']||r['Cantidad']),sourceSent:n(r['Cant. Enviada']),stable,desc:r['Descripción de lo que se pidio']||r['Descripción de lo que se pidió']||'',pedido,solicitud:r['N° de solicitud']||'',sent:0};
          }).filter(r=>r.code&&r.p&&!rejected.has(r.stable));
          const byKey=new Map();
          for(const r of requests){const k=`${r.code}__${r.p}`;if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(r);}
          for(const q of byKey.values())q.sort((a,b)=>(a.date||0)-(b.date||0)||a.i-b.i);
          const shipments=(snap.remitos||[]).map((r,i)=>({i,code:normCode(r.CODIGO_ARTICULO),p:project(r.PROYECTO||r.OBSERVACIONES||r.DESTINO||r.ORIGEN),date:dateMs(r.FECHA_REMITO),dateText:r.FECHA_REMITO,qty:n(r.CANTIDAD_ENVIADA),desc:r.DESCRIPCION||'',remito:r.N_REMITO||r.NRO_REMITO||''})).filter(r=>r.code&&r.p&&r.qty>0).sort((a,b)=>(a.date||0)-(b.date||0)||a.i-b.i);
          for(const s of shipments){let remain=s.qty;const q=byKey.get(`${s.code}__${s.p}`)||[];for(const r of q){if(remain<=0)break;if(r.date&&s.date&&r.date>s.date)continue;const pend=Math.max(0,r.qty-r.sent);if(!pend)continue;const used=Math.min(pend,remain);r.sent+=used;remain-=used;}}
          const sourcePending=requests.filter(r=>r.sourceSent<=0);
          const algoPending=requests.filter(r=>r.sent<=0);
          const sourcePendingAlgoSent=requests.filter(r=>r.sourceSent<=0&&r.sent>0);
          const sourceSentAlgoPending=requests.filter(r=>r.sourceSent>0&&r.sent<=0);
          console.log('COUNTS',JSON.stringify({sourcePending:sourcePending.length,algoPending:algoPending.length,sourcePendingAlgoSent:sourcePendingAlgoSent.length,sourceSentAlgoPending:sourceSentAlgoPending.length}));
          console.log('SOURCE_PENDING_BUT_ALGO_SENT',JSON.stringify(sourcePendingAlgoSent.slice(0,30),null,2));
          console.log('SOURCE_SENT_BUT_ALGO_PENDING',JSON.stringify(sourceSentAlgoPending.slice(0,30),null,2));
          NODE
