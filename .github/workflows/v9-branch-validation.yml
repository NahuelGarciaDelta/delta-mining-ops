name: Validar piloto V9

on:
  push:
    branches:
      - feature/v9-ops-supabase-app-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      # v9-ops is intentionally retired (HTTP 410). Its legacy proxy contract tests
      # are not valid for the active independent V9 read/write gateways.
      - name: Validar fuentes y controles de escritura V9 actuales
        run: node --test tests/v9-gas-sources.test.mjs tests/v9-taller-write-gates.test.mjs tests/v9-errors-atraso-all-equipment.test.mjs
      - name: Validar compilación de la app V9
        run: npm run build -- --config vite.v9.config.js
      - name: Verificar base de pruebas
        run: npm run check
