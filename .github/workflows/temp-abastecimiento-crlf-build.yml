name: temp-abastecimiento-crlf-build
on:
  push:
    branches: [fix/abastecimiento-crlf-build]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CRLF regression test
        run: node --test tests/abastecimiento-crlf-build.test.mjs
      - name: Validate normal LF build
        run: npm run build
      - name: Convert Abastecimiento source to Windows CRLF
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/abastecimiento/AbastecimientoModule.jsx')
          raw=p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n')
          p.write_bytes(raw.replace(b'\n',b'\r\n'))
          PY
      - name: Validate full build with Windows CRLF source
        run: npm run build
      - name: Restore source after CRLF simulation
        run: git checkout -- src/modules/abastecimiento/AbastecimientoModule.jsx
      - name: Validate imports
        run: node scripts/validate-local-imports.mjs
      - name: Security audit
        run: npm run lint:security
      - name: Diff check
        run: git diff --check
