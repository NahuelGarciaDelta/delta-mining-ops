name: temp-verify-abastecimiento-final

on:
  push:
    branches:
      - verify/abastecimiento-final-938
  workflow_dispatch:

jobs:
  verify-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify 927 + 11 = 938
        run: node --test --test-name-pattern="Ítems con salida" tests/abastecimiento-allocation-regression.test.mjs
      - name: Verify average only closed
        run: node --test --test-name-pattern="Promedio indicador" tests/abastecimiento-allocation-regression.test.mjs
      - name: Verify Abastecimiento regressions
        run: node --test tests/abastecimiento-allocation-regression.test.mjs
      - name: Build
        run: npm run build
      - name: Full suite diagnostic
        id: fullsuite
        shell: bash
        run: |
          set +e
          npm test > current-full-suite.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat current-full-suite.log
          exit 0
      - name: Upload current suite log
        uses: actions/upload-artifact@v4
        with:
          name: current-full-suite-log
          path: current-full-suite.log

  verify-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 52279f1b88c16244cf579484a251c6dbda79371f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Baseline full suite diagnostic
        shell: bash
        run: |
          set +e
          npm test > baseline-full-suite.log 2>&1
          status=$?
          echo "BASELINE_EXIT_CODE=$status"
          cat baseline-full-suite.log
          exit 0
      - name: Upload baseline suite log
        uses: actions/upload-artifact@v4
        with:
          name: baseline-full-suite-log
          path: baseline-full-suite.log
