name: Fix dashboard filter and PM trucks 500h

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pm-trucks-20260914.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply dashboard column-filter correction
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/services/globalTableColumnFilters.js')
          s=path.read_text(encoding='utf-8')
          old='''function eligible(table){
            if(!(table instanceof HTMLTableElement)||!visible(table))return false;
            if(table.closest?.("[data-dm-disable-global-column-filters='1']"))return false;
            if(hasNativeColumnFilters(table))return false;
            return leafHeaderLabels(table).length>0;
          }'''
          new='''function eligible(table){
            if(!(table instanceof HTMLTableElement)||!visible(table))return false;
            if(table.closest?.("[data-dm-disable-global-column-filters='1']"))return false;
            if(table.closest?.(".recharts-wrapper,.recharts-responsive-container,[class*='recharts-']"))return false;
            if(hasNativeColumnFilters(table))return false;
            return leafHeaderLabels(table).length>0;
          }'''
          if old not in s: raise SystemExit('eligible() block not found')
          path.write_text(s.replace(old,new,1),encoding='utf-8')

      - name: Apply truck PM correction
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          path=Path('src/modules/mantenimiento/MantenimientoProgramadoView.jsx')
          s=path.read_text(encoding='utf-8')

          old_import='import { registerRefreshTask } from "../../services/refreshManager.js";'
          new_import='''import { registerRefreshTask } from "../../services/refreshManager.js";
          import { normalizeVehicleFamily } from "../../shared/domain/index.jsx";
          import {
            TRUCK_PM_INTERVAL_HOURS,
            TRUCK_PM_ALERT_FROM_HOURS,
            TRUCK_PM_OVERDUE_FROM_HOURS,
            getNextTruckPmHour,
            isCanonicalTruckFamily,
            selectMaintenanceCounter,
          } from "./pmRules.js";'''
          if old_import not in s: raise SystemExit('refreshManager import not found')
          s=s.replace(old_import,new_import,1)

          old='''function categoriaPM(equipo) {
            return esCamionetaPM(equipo) ? "vehiculos" : "pesados";
          }'''
          new='''function esCamionPM(equipo) {
            const familiaCanonica = normalizeVehicleFamily(equipo?.familia || equipo?.tipoEquipo || equipo?.equipo || "");
            return isCanonicalTruckFamily(familiaCanonica);
          }

          function categoriaPM(equipo) {
            return esCamionetaPM(equipo) ? "vehiculos" : "pesados";
          }'''
          if old not in s: raise SystemExit('categoriaPM block not found')
          s=s.replace(old,new,1)

          old='''function ropHoras(row) {
            // Compatibilidad con datos normalizados (`horometroFinal`) y datos crudos (`HF`).
            return Math.max(
              num(row?.horometroFinal),
              num(row?.horometroInicial),
              num(pick(row, ["hf", "horometro final", "horómetro final", "km final", "kilometraje final"])),
              num(pick(row, ["hi", "horometro inicial", "horómetro inicial"])),
              num(row?.horas),
              num(pick(row, ["horas", "hs"]))
            );
          }'''
          new='''function ropHoras(row, { esCamion = false } = {}) {
            const horometerCandidates = [
              num(row?.horometroFinal),
              num(row?.horometroInicial),
              num(pick(row, ["hf", "horometro final", "horómetro final"])),
              num(pick(row, ["hi", "horometro inicial", "horómetro inicial"])),
              num(row?.horas),
              num(pick(row, ["horas", "hs"]))
            ];
            const mileageCandidates = [
              num(row?.kilometrajeFinal),
              num(row?.kmFinal),
              num(pick(row, ["km final", "kilometraje final"]))
            ];
            return selectMaintenanceCounter({ horometerCandidates, mileageCandidates }, { isTruck: esCamion });
          }'''
          if old not in s: raise SystemExit('ropHoras block not found')
          s=s.replace(old,new,1)

          old='''function statusFor(row) {
            const actual = num(row.horometroActual);
            const ultimo = num(row.horometroUltimoPM);
            const transcurridas = ultimo > 0 ? Math.max(0, actual - ultimo) : 0;
            const alerta = num(row.alertaDesde) || DEFAULTS.alertaDesde;
            const atrasado = num(row.atrasadoDesde) || DEFAULTS.atrasadoDesde;
            const intervalo = num(row.intervalo) || DEFAULTS.intervalo;
            let estado = "AL DÍA", color = "ok";
            const margenUrgente = Math.max(20, Math.min(50, atrasado - intervalo));
            if (!ultimo) { estado = "SIN BASE"; color = "muted"; }
            else if (transcurridas >= atrasado) { estado = "PM ATRASADO"; color = "danger"; }
            else if (transcurridas >= intervalo || transcurridas >= atrasado - margenUrgente) { estado = "PM URGENTE"; color = "danger"; }
            else if (transcurridas >= alerta) { estado = "PM PRÓXIMO"; color = "warn"; }
            return {
              ...row,
              transcurridas,
              proximoPM: ultimo ? ultimo + intervalo : 0,
              faltan: ultimo ? Math.max(0, (ultimo + intervalo) - actual) : 0,
              estado,
              color,
            };
          }'''
          new='''function statusFor(row) {
            const actual = num(row.horometroActual);
            const ultimo = num(row.horometroUltimoPM);
            const esCamion = !!row.pmEsCamion;
            const transcurridas = ultimo > 0 ? Math.max(0, actual - ultimo) : 0;
            const alerta = esCamion ? TRUCK_PM_ALERT_FROM_HOURS : (num(row.alertaDesde) || DEFAULTS.alertaDesde);
            const atrasado = esCamion ? TRUCK_PM_OVERDUE_FROM_HOURS : (num(row.atrasadoDesde) || DEFAULTS.atrasadoDesde);
            const intervalo = esCamion ? TRUCK_PM_INTERVAL_HOURS : (num(row.intervalo) || DEFAULTS.intervalo);
            const proximoPM = esCamion ? getNextTruckPmHour(actual, ultimo) : (ultimo ? ultimo + intervalo : 0);
            let estado = "AL DÍA", color = "ok";
            const margenUrgente = Math.max(20, Math.min(50, atrasado - intervalo));
            if (!ultimo) { estado = "SIN BASE"; color = "muted"; }
            else if (transcurridas >= atrasado) { estado = "PM ATRASADO"; color = "danger"; }
            else if (transcurridas >= intervalo || transcurridas >= atrasado - margenUrgente) { estado = "PM URGENTE"; color = "danger"; }
            else if (transcurridas >= alerta) { estado = "PM PRÓXIMO"; color = "warn"; }
            return {
              ...row,
              intervalo,
              alertaDesde: alerta,
              atrasadoDesde: atrasado,
              unidadMantenimiento: esCamion ? "h" : row.unidadMantenimiento,
              transcurridas,
              proximoPM,
              faltan: proximoPM ? Math.max(0, proximoPM - actual) : 0,
              estado,
              color,
            };
          }'''
          if old not in s: raise SystemExit('statusFor block not found')
          s=s.replace(old,new,1)

          marker='  const actividad7Dias = useMemo(() => {'
          insert='''  const truckInternos = useMemo(() => {
            const out = new Set();
            (listaEquipos || []).forEach(raw => {
              const equipo = equipoFromLista(raw);
              if (esCamionPM(equipo)) {
                const key = norm(equipo.interno);
                if (key) out.add(key);
              }
            });
            return out;
          }, [listaEquipos]);

          const actividad7Dias = useMemo(() => {'''
          if marker not in s: raise SystemExit('actividad marker not found')
          s=s.replace(marker,insert,1)
          if '      const horas = ropHoras(row);' not in s: raise SystemExit('ropHoras call not found')
          s=s.replace('      const horas = ropHoras(row);','      const horas = ropHoras(row, { esCamion: truckInternos.has(key) });',1)
          if '  }, [rop02All, fechaDesde, fechaHasta]);' not in s: raise SystemExit('actividad deps not found')
          s=s.replace('  }, [rop02All, fechaDesde, fechaHasta]);','  }, [rop02All, fechaDesde, fechaHasta, truckInternos]);',1)

          old='''      const cfg = configMap.get(key) || {};
              base.push(statusFor({'''.replace('              ','      ')
          new='''      const cfg = configMap.get(key) || {};
              const pmEsCamion = esCamionPM(e);
              base.push(statusFor({'''.replace('              ','      ')
          if old not in s: raise SystemExit('cfg block not found')
          s=s.replace(old,new,1)

          old='''        proyecto: actividad.proyecto || cfg.proyecto || e.proyecto,
                intervalo: num(cfg.intervalo) || DEFAULTS.intervalo,
                alertaDesde: num(cfg.alertaDesde) || DEFAULTS.alertaDesde,
                atrasadoDesde: num(cfg.atrasadoDesde) || DEFAULTS.atrasadoDesde,
                horometroUltimoPM: num(cfg.horometroUltimoPM),'''.replace('                ','        ')
          new='''        proyecto: actividad.proyecto || cfg.proyecto || e.proyecto,
                pmEsCamion,
                intervalo: pmEsCamion ? TRUCK_PM_INTERVAL_HOURS : (num(cfg.intervalo) || DEFAULTS.intervalo),
                alertaDesde: pmEsCamion ? TRUCK_PM_ALERT_FROM_HOURS : (num(cfg.alertaDesde) || DEFAULTS.alertaDesde),
                atrasadoDesde: pmEsCamion ? TRUCK_PM_OVERDUE_FROM_HOURS : (num(cfg.atrasadoDesde) || DEFAULTS.atrasadoDesde),
                unidadMantenimiento: pmEsCamion ? "h" : cfg.unidadMantenimiento,
                horometroUltimoPM: num(cfg.horometroUltimoPM),'''.replace('                ','        ')
          if old not in s: raise SystemExit('PM fields block not found')
          s=s.replace(old,new,1)
          path.write_text(s,encoding='utf-8')

          Path('src/modules/mantenimiento/pmRules.js').write_text(dedent('''
          export const TRUCK_PM_INTERVAL_HOURS = 500;
          export const TRUCK_PM_ALERT_FROM_HOURS = 400;
          export const TRUCK_PM_OVERDUE_FROM_HOURS = 600;
          const numeric = value => { const n=Number(value); return Number.isFinite(n)?n:0; };
          const normalizeFamily = value => String(value ?? "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();
          export function isCanonicalTruckFamily(value){ return /^CAMION(?:\\s|$)/.test(normalizeFamily(value)); }
          export function selectMaintenanceCounter({horometerCandidates=[],mileageCandidates=[]}={}, {isTruck=false}={}){
            const maxValue=values=>Math.max(0,...(values||[]).map(numeric));
            const horometer=maxValue(horometerCandidates);
            return isTruck?horometer:Math.max(horometer,maxValue(mileageCandidates));
          }
          export function getNextTruckPmHour(currentHour,lastPmHour=0){
            const current=Math.max(0,numeric(currentHour));
            const last=Math.max(0,numeric(lastPmHour));
            if(!current)return 0;
            let target=Math.ceil(current/TRUCK_PM_INTERVAL_HOURS)*TRUCK_PM_INTERVAL_HOURS;
            if(target===current&&last>=current)target+=TRUCK_PM_INTERVAL_HOURS;
            return target;
          }
          ''').lstrip(),encoding='utf-8')

          Path('tests/pm-truck-rules.test.mjs').write_text(dedent('''
          import test from "node:test";
          import assert from "node:assert/strict";
          import {TRUCK_PM_INTERVAL_HOURS,getNextTruckPmHour,isCanonicalTruckFamily,selectMaintenanceCounter} from "../src/modules/mantenimiento/pmRules.js";
          test("truck family classification includes trucks and excludes camionetas",()=>{
            for(const family of ["CAMION","CAMIÓN REGADOR","CAMION VOLCADOR","CAMION DE COMBUSTIBLE","CAMION TRACTOR"]) assert.equal(isCanonicalTruckFamily(family),true);
            for(const family of ["CAMIONETA","CAMIONETA CON MOCHILA"]) assert.equal(isCanonicalTruckFamily(family),false);
          });
          test("truck PM uses horometer and ignores mileage",()=>{
            assert.equal(selectMaintenanceCounter({horometerCandidates:[1380],mileageCandidates:[126000]},{isTruck:true}),1380);
          });
          test("truck PM interval and next milestone are exactly 500 hours",()=>{
            assert.equal(TRUCK_PM_INTERVAL_HOURS,500);
            assert.equal(getNextTruckPmHour(1380,1000),1500);
            assert.equal(1500-1380,120);
            assert.equal(getNextTruckPmHour(1500,1500),2000);
          });
          ''').lstrip(),encoding='utf-8')

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/globalTableColumnFilters.js src/modules/mantenimiento/MantenimientoProgramadoView.jsx src/modules/mantenimiento/pmRules.js tests/pm-truck-rules.test.mjs
          git commit -m "fix: restore dashboard layout and enforce truck PM 500h"
          git push origin main
