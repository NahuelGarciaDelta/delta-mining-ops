name: Equipment project internal link

on:
  push:
    paths:
      - '.github/workflows/equipment-project-internal-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/apply-equipment-project-internal-link.py
      - name: Validate
        run: npm ci && npm run validate && npm run build
      - name: Commit
        run: |
          git config user.name "Delta Mining OPS Automation"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Vincular internos en cambios de proyecto"
          git push origin HEAD:main
