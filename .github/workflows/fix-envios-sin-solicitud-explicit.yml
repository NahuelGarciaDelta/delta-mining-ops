name: Fix envios sin solicitud explicit links

on:
  push:
    branches:
      - fix/envios-sin-solicitud-explicit-links-20260914

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Patch source
        run: python .github/scripts/patch-envios-sin-solicitud.py
      - name: Regression assertions
        run: |
          grep -q 'numeroRemitoFuente' src/modules/abastecimiento/AbastecimientoModule.jsx
          grep -q '_raba03ExplicitLinksLoaded:true' src/modules/abastecimiento/AbastecimientoModule.jsx
          grep -q 'buildEnviosSinSolicitudRows' src/modules/abastecimiento/AbastecimientoModule.jsx
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/abastecimiento/AbastecimientoModule.jsx
          git commit -m 'fix: restore envios sin solicitud from explicit RABA03 links'
          git push origin HEAD:fix/envios-sin-solicitud-explicit-links-20260914
