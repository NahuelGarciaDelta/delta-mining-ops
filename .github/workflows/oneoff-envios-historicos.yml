name: One-off historical unmatched shipments
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-envios-historicos.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply historical shipment fix
        run: python scripts/oneoff_envios_historicos.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit validated change and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/abastecimiento/AbastecimientoModule.jsx
          git rm scripts/oneoff_envios_historicos.py .github/workflows/oneoff-envios-historicos.yml
          git commit -m 'Preserve historical unmatched shipments'
          git push origin main
