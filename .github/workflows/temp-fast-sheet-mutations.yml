name: temp-fast-sheet-mutations
on:
  push:
    branches: [fix/abastecimiento-infinite-loading]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fast mutation patch
        run: python scripts/temp-fast-sheet-mutations.py
      - name: Verify mutation policy
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('src/modules/abastecimiento/AbastecimientoModule.jsx').read_text()
          o=Path('src/modules/oficina-tecnica/OficinaTecnicaModule.jsx').read_text()
          m=Path('src/modules/mantenimiento/MantenimientoProgramadoView.jsx').read_text()
          t=Path('src/modules/taller-central/TallerCentralMovementPage.jsx').read_text()
          tl=Path('src/modules/taller-central/TallerCentralMovements.jsx').read_text()
          assert 'await loadEstadosSolicitudesCompartidos({silent:true});' not in a
          assert 'El rechazo se guardó, pero falló la verificación en segundo plano' in a
          assert 'loadRaba03({silent:true}).catch' in a
          reg=a[a.index('  const registerRemito=async()=>{'):a.index('  const deleteRemito=async(id)=>{')]
          dele=a[a.index('  const deleteRemito=async(id)=>{'):a.index('  const badgeStyle=',a.index('  const deleteRemito=async(id)=>{'))]
          assert 'await loadRemitosCompartidos' not in reg
          assert 'await loadRemitosCompartidos' not in dele
          assert 'await persistRaba03AllocationForPairs' in reg
          assert 'await persistRaba03AllocationForPairs' in dele
          assert 'if(onReloadLista)await onReloadLista();' not in o
          assert 'await load();' not in m
          assert 'await load();' not in t
          assert 'await reload();' not in tl
          print('mutation policy verified')
          PY
      - name: Abastecimiento regressions
        run: |
          node --test tests/abastecimiento-reject-fast-regression.test.mjs
          node --test tests/abastecimiento-loading-regression.test.mjs
          node --test tests/abastecimiento-allocation-regression.test.mjs
      - name: Validate imports
        run: node scripts/validate-local-imports.mjs
      - name: Security audit
        run: npm run lint:security
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/abastecimiento/AbastecimientoModule.jsx src/modules/oficina-tecnica/OficinaTecnicaModule.jsx src/modules/mantenimiento/MantenimientoProgramadoView.jsx src/modules/taller-central/TallerCentralMovementPage.jsx src/modules/taller-central/TallerCentralMovements.jsx
          if ! git diff --cached --quiet; then
            git commit -m 'perf: make Google Sheets mutations responsive'
            git push
          fi
