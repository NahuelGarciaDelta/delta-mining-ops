name: Full OPS Parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: full-ops-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DM_PERF_EMAIL: ${{ secrets.DM_PERF_EMAIL }}
      DM_PERF_PASSWORD: ${{ secrets.DM_PERF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Source parity guard
        run: |
          git fetch origin main
          node scripts/regression-source-guard.mjs origin/main
      - name: Build candidate
        run: npm run build
      - name: PM regression tests
        run: node --test tests/pm-vite-pipeline-regression.test.mjs tests/pm-truck-rules.test.mjs
      - name: Check browser credentials
        run: |
          test -n "$DM_PERF_EMAIL"
          test -n "$DM_PERF_PASSWORD"
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Resolve baseline and candidate deployments
        id: urls
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          baseline="https://delta-mining-ops.vercel.app"
          candidate=""
          for attempt in $(seq 1 30); do
            comments="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" 2>/dev/null || echo '[]')"
            candidate="$(printf '%s' "$comments" | jq -r '
              [ .[]
                | select(.user.login=="vercel[bot]")
                | .body
                | capture("\\[Preview\\]\\((?<url>https://[^)]+\\.vercel\\.app)\\)")?.url
              ] | map(select(. != null)) | last // empty
            ')"
            if [ -n "$candidate" ]; then
              code="$(curl -L -sS --max-time 20 -o /tmp/dm-candidate.html -w '%{http_code}' "$candidate/" || echo 000)"
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null; then break; fi
            fi
            candidate=""
            echo "Esperando Preview URL de Vercel ($attempt/30)..." >&2
            sleep 10
          done
          test -n "$candidate"
          base_code="$(curl -L -sS --max-time 20 -o /tmp/dm-baseline.html -w '%{http_code}' "$baseline/" || echo 000)"
          test "$base_code" -ge 200
          test "$base_code" -lt 400
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      - name: Compare OPS vs candidate
        env:
          DM_BASELINE_URL: ${{ steps.urls.outputs.baseline }}
          DM_CANDIDATE_URL: ${{ steps.urls.outputs.candidate }}
        run: node scripts/full-regression-compare.mjs
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ops-parity
          path: artifacts/full-regression/
          if-no-files-found: warn
          retention-days: 14
