name: Validate Abastecimiento source of truth

on:
  push:
    branches: [fix/abastecimiento-source-of-truth-20260914]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply fix
        run: node scripts/apply-abastecimiento-source-of-truth.mjs
      - name: Regression tests
        run: node --test tests/abastecimiento-allocation-regression.test.mjs tests/enviosSinSolicitud.test.mjs
      - name: Validate current Supabase snapshot
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const api=fs.readFileSync('src/services/raba03ReadApi.js','utf8');
          const url=(api.match(/https:\/\/[^"']+\.supabase\.co/)||[])[0];
          const key=(api.match(/sb_publishable_[A-Za-z0-9_-]+/)||[])[0];
          if(!url||!key)throw new Error('No se pudo leer Supabase URL/key');
          const norm=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const normCode=v=>String(v??'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'').trim();
          const proj=v=>{const t=norm(v),c=t.replace(/\s+/g,'');if(t.includes('jose maria')||c.includes('josemaria'))return 'JOSE MARIA';if(t.includes('filo del sol')||c.includes('filodelsol'))return 'FILO DEL SOL';return String(v??'').trim().toUpperCase();};
          const dateMs=v=>{const s=String(v??'').trim();if(!s)return 0;const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]).getTime();const dm=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);if(dm){let y=+dm[3];if(y<100)y+=2000;return new Date(y,+dm[2]-1,+dm[1]).getTime();}const d=new Date(s);return Number.isNaN(d.getTime())?0:d.getTime();};
          const num=v=>{const x=Number(String(v??0).replace(/\./g,'').replace(',','.'));return Number.isFinite(x)?x:0;};
          const res=await fetch(url+'/rest/v1/rpc/abastecimiento_snapshot',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:'{}'});
          if(!res.ok)throw new Error('snapshot HTTP '+res.status);
          const snap=await res.json();
          const states=new Map((snap.estados||[]).map(e=>[String(e.CLAVE_SOLICITUD||'').trim(),String(e.ESTADO||'').toUpperCase()]));
          const requests=(snap.raba03||[]).map((r,i)=>{
            const code=normCode(r['Código de articulo']||r['Código de artículo']);
            const project=proj(r['Centro de Costo']);
            const requestDate=String(r['Fecha de solicitud']||'').slice(0,10);
            const pedido=String(r['N° de pedido']||r['N° de solicitud']||'').trim();
            const stable=[normCode(pedido),code,requestDate].join('|');
            return {i,code,project,desc:norm(r['Descripción de lo que se pidio']||r['Descripción de lo que se pidió']),date:dateMs(r['Fecha de solicitud']),qty:num(r['Cant. Solicitada']||r['Cantidad']),sent:num(r['Cant. Enviada']||r['Cantidad enviada']),state:states.get(stable)||''};
          });
          const active=requests.filter(r=>r.state!=='RECHAZADA');
          const metrics={
            pendientes:active.filter(r=>r.sent<=0&&r.state!=='CERRADA_MANUAL').length,
            parciales:active.filter(r=>r.sent>0&&r.sent<r.qty&&r.state!=='CERRADA_MANUAL').length,
            cerradas:active.filter(r=>r.qty>0&&(r.sent>=r.qty||r.state==='CERRADA_MANUAL')).length,
            rechazadas:requests.filter(r=>r.state==='RECHAZADA').length,
            total:requests.length
          };
          console.log('RABA03_METRICS '+JSON.stringify(metrics));
          const expected={pendientes:308,parciales:11,cerradas:927,rechazadas:68,total:1314};
          for(const [k,v] of Object.entries(expected))if(metrics[k]!==v)throw new Error(`${k}: esperado ${v}, obtenido ${metrics[k]}`);

          const valid=active.filter(r=>r.code&&r.desc);
          let unmatched=0,unmatchedQty=0;
          for(const s of (snap.remitos||[])){
            const code=normCode(s.CODIGO_ARTICULO);
            const description=norm(s.DESCRIPCION);
            const project=proj(s.PROYECTO||s.OBSERVACIONES||s.DESTINO||s.ORIGEN);
            const sentDate=dateMs(s.FECHA_REMITO);
            const qty=num(s.CANTIDAD_ENVIADA);
            if(!code||!description||qty<=0)continue;
            const existed=valid.some(r=>r.code===code&&(!project||!r.project||r.project===project)&&r.desc===description&&(!r.date||!sentDate||r.date<=sentDate));
            if(!existed){unmatched++;unmatchedQty+=qty;}
          }
          console.log('ENVIOS_SIN_SOLICITUD '+JSON.stringify({unmatched,unmatchedQty}));
          if(unmatched!==184)throw new Error(`Envíos sin solicitud: esperado 184 con snapshot actual, obtenido ${unmatched}`);
          NODE
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/abastecimiento/AbastecimientoModule.jsx scripts/abastecimiento-instant-vite-plugin.mjs tests/abastecimiento-allocation-regression.test.mjs
          git rm scripts/apply-abastecimiento-source-of-truth.mjs .github/workflows/validate-abastecimiento-source-of-truth.yml
          git commit -m "fix: align Abastecimiento states with RABA03 source"
          git push origin HEAD:fix/abastecimiento-source-of-truth-20260914
