name: Validate bidirectional sync

on:
  push:
    branches:
      - fix/bidirectional-sync-20260916
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate local imports
        run: node scripts/validate-local-imports.mjs
      - name: Syntax checks
        run: npm run check
      - name: Security audit
        run: npm run lint:security
      - name: Test ROP02 control reference vehicles
        if: always()
        run: node --test tests/rop02-control-reference-vehicles.test.mjs
      - name: Test ROP02 all trucks same
        if: always()
        run: node --test tests/rop02-all-trucks-same.test.mjs
      - name: Test ROP02 trucks pickups split
        if: always()
        run: node --test tests/rop02-trucks-pickups-split.test.mjs
      - name: Test PM Vite pipeline
        if: always()
        run: node --test tests/pm-vite-pipeline-regression.test.mjs
      - name: Test stock auth session
        if: always()
        run: node --test tests/stock-auth-session.test.mjs
      - name: Test stock validation
        if: always()
        run: node --test tests/stock-validation.test.mjs
      - name: Test remaining suite
        if: always()
        shell: bash
        run: |
          set -e
          for f in tests/*.test.mjs; do
            case "$f" in
              tests/rop02-control-reference-vehicles.test.mjs|tests/rop02-all-trucks-same.test.mjs|tests/rop02-trucks-pickups-split.test.mjs|tests/pm-vite-pipeline-regression.test.mjs|tests/stock-auth-session.test.mjs|tests/stock-validation.test.mjs) continue ;;
            esac
            node --test "$f"
          done
