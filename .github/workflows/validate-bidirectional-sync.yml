name: Validate main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Dev server smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/delta-vite-dev.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/tmp/delta-vite-index.html; then
              test -s /tmp/delta-vite-index.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/delta-vite-dev.log
          exit 1
      - name: Validate local imports
        run: node scripts/validate-local-imports.mjs
      - name: Syntax checks
        run: npm run check
      - name: Security audit
        run: npm run lint:security
      - name: Test ROP02 control reference vehicles
        if: always()
        run: node --test tests/rop02-control-reference-vehicles.test.mjs
      - name: Test ROP02 all trucks same
        if: always()
        run: node --test tests/rop02-all-trucks-same.test.mjs
      - name: Test ROP02 trucks pickups split
        if: always()
        run: node --test tests/rop02-trucks-pickups-split.test.mjs
      - name: Test PM Vite pipeline
        if: always()
        run: node --test tests/pm-vite-pipeline-regression.test.mjs
      - name: Test stock auth session
        if: always()
        run: node --test tests/stock-auth-session.test.mjs
      - name: Test stock validation
        if: always()
        run: node --test tests/stock-validation.test.mjs
      - name: Test historical screen migration
        if: always()
        run: node --test tests/historical-screen-migration.test.mjs
      - name: Test home availability
        if: always()
        run: node --test tests/home-availability.test.mjs
      - name: Test home dashboard history
        if: always()
        run: node --test tests/home-dashboard-history.test.mjs
      - name: Test instant startup
        if: always()
        run: node --test tests/instant-startup-regression.test.mjs
      - name: Test RABA03 sheet authority
        if: always()
        run: node --test tests/raba03-sheet-authority.test.mjs
      - name: Test remaining suite
        if: always()
        shell: bash
        run: |
          set -e
          for f in tests/*.test.mjs; do
            case "$f" in
              tests/rop02-control-reference-vehicles.test.mjs|tests/rop02-all-trucks-same.test.mjs|tests/rop02-trucks-pickups-split.test.mjs|tests/pm-vite-pipeline-regression.test.mjs|tests/stock-auth-session.test.mjs|tests/stock-validation.test.mjs|tests/historical-screen-migration.test.mjs|tests/home-availability.test.mjs|tests/home-dashboard-history.test.mjs|tests/instant-startup-regression.test.mjs|tests/raba03-sheet-authority.test.mjs) continue ;;
            esac
            node --test "$f"
          done
