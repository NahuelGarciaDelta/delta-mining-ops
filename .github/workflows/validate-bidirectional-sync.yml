name: Validate bidirectional sync

on:
  push:
    branches:
      - fix/bidirectional-sync-20260916
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate local imports
        run: node scripts/validate-local-imports.mjs
      - name: Syntax checks
        run: npm run check
      - name: Security audit
        run: npm run lint:security
      - name: Tests
        run: npm test
