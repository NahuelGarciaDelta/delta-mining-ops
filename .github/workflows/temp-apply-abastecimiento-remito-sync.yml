name: temp-apply-abastecimiento-remito-sync
on:
  push:
    branches: [fix/abastecimiento-remito-sync-loading]
permissions:
  contents: write
jobs:
  validate:
    if: "startsWith(github.event.head_commit.message, 'ci: apply and validate Abastecimiento remito sync')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply fix
        run: python scripts/temp-fix-abastecimiento-remito-sync.py
      - name: Validate imports
        run: node scripts/validate-local-imports.mjs
      - name: Security audit
        run: npm run lint:security
      - name: Abastecimiento regression tests
        run: node --test tests/abastecimiento*.test.mjs tests/enviosSinSolicitud.test.mjs tests/global-column-filters.test.mjs
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Verify critical behavior in built source
        run: |
          grep -q 'Eliminando remito y actualizando Google Sheets' src/modules/abastecimiento/AbastecimientoModule.jsx
          grep -q 'persistRaba03AllocationForPairs' src/modules/abastecimiento/AbastecimientoModule.jsx
          grep -q 'const key=\[code,proyecto\].join("__")' src/modules/abastecimiento/AbastecimientoModule.jsx
          ! grep -q 'setRemitos(prev=>prev.filter(r=>r.id!==id))' src/modules/abastecimiento/AbastecimientoModule.jsx
          grep -q 'dm_raba03_view_rows_v4' scripts/abastecimiento-instant-vite-plugin.mjs
      - name: Commit validated fix
        run: |
          rm -f scripts/temp-fix-abastecimiento-remito-sync.py
          rm -f .github/workflows/temp-apply-abastecimiento-remito-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm remitos and sync RABA03"
          git push
