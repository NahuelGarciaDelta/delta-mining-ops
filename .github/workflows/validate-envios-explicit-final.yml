name: Validate envios sin solicitud final fix

on:
  push:
    branches:
      - fix/envios-explicit-links-final-20260914

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Envíos sin solicitud regression tests
        run: node --test tests/enviosSinSolicitud.test.mjs
      - name: Production build
        run: npm run build
