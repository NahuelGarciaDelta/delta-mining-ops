name: temp-rop02-duplicate-loads
on:
  push:
    branches: [fix/rop02-duplicate-loads]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply duplicate-load UI patch
        run: python scripts/temp-add-rop02-duplicate-errors.py
      - name: Duplicate-load rules
        run: node --test tests/rop02-duplicate-loads.test.mjs
      - name: Verify integration markers
        run: |
          grep -q 'detectRop02DuplicateLoads' src/modules/oficina-tecnica/OficinaTecnicaModule.jsx
          grep -q 'label="Cargas duplicadas"' src/modules/oficina-tecnica/OficinaTecnicaModule.jsx
          grep -q 'value:"duplicadas",label:"Cargas duplicadas"' src/modules/oficina-tecnica/OficinaTecnicaModule.jsx
          grep -q '_tipo:"Carga duplicada"' src/modules/oficina-tecnica/OficinaTecnicaModule.jsx
      - name: Validate imports
        run: node scripts/validate-local-imports.mjs
      - name: Security audit
        run: npm run lint:security
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated source integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/oficina-tecnica/OficinaTecnicaModule.jsx
          if ! git diff --cached --quiet; then
            git commit -m 'feat: flag duplicate ROP02 daily loads'
            git push
          fi
