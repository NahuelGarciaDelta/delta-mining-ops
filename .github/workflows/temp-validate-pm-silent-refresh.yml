name: temp-validate-pm-silent-refresh
on:
  push:
    branches: [fix/abastecimiento-infinite-loading]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply PM silent refresh fix
        run: python scripts/temp-fix-pm-silent-refresh.py
      - name: Verify silent policy
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/modules/mantenimiento/MantenimientoProgramadoView.jsx').read_text()
          assert 'if (!silent) appAlert?.(err.message);' in s
          assert 'recarga silenciosa de Mantenimiento Programado' in s
          assert 'await load();' not in s
          print('silent PM refresh verified')
          PY
      - name: Abastecimiento regressions
        run: |
          node --test tests/abastecimiento-reject-fast-regression.test.mjs
          node --test tests/abastecimiento-loading-regression.test.mjs
          node --test tests/abastecimiento-allocation-regression.test.mjs
      - name: Validate imports
        run: node scripts/validate-local-imports.mjs
      - name: Security audit
        run: npm run lint:security
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/mantenimiento/MantenimientoProgramadoView.jsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: keep PM background refresh silent'
            git push
          fi
