name: Apply final PM and dashboard fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-pm-dashboard-fixes-20260914.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply safe source fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Global column filters: never decorate Recharts/dashboard internals.
          p=Path('src/services/globalTableColumnFilters.js')
          s=p.read_text(encoding='utf-8')
          needle='''  if(table.closest?.("[data-dm-disable-global-column-filters='1']"))return false;\n  if(hasNativeColumnFilters(table))return false;'''
          repl='''  if(table.closest?.("[data-dm-disable-global-column-filters='1']"))return false;\n  if(table.closest?.(".recharts-wrapper,.recharts-responsive-container,[class*='recharts-']"))return false;\n  if(hasNativeColumnFilters(table))return false;'''
          if needle not in s:
              raise SystemExit('global filter anchor not found')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          # 2) Equipment profile: maintenance uses latest absolute ROP02 reading,
          # sanitized intervals, and 500-hour absolute milestones for trucks.
          p=Path('src/modules/equipment/EquipmentProfileView.jsx')
          s=p.read_text(encoding='utf-8')
          old='''  const pmInfo=useMemo(()=>{\n    const cfg=pmCfgIndex.get(selectedKey)||{};\n    const latestReg=pmReg[0]||null;\n    const lastH=Number(latestReg?pick(latestReg,["Horometro","Horómetro","Km / hs"]):pick(cfg,["horometroUltimoPM","Horómetro último PM"]))||0;\n    const lastDate=latestReg?pick(latestReg,["Fecha","Fecha PM"]):pick(cfg,["fechaUltimoPM","Fecha último PM"]);\n    const interval=Number(pick(cfg,["intervalo","Intervalo"]))||250;\n    const next=lastH?lastH+interval:0;\n    const since=lastH&&summary.currentH?Math.max(0,summary.currentH-lastH):0;\n    const remaining=next&&summary.currentH?next-summary.currentH:null;\n    let status="SIN BASE";if(lastH){status=remaining!=null&&remaining<0?"ATRASADO":remaining!=null&&remaining<=50?"PRÓXIMO":"AL DÍA";}\n    return{lastH,lastDate,interval,next,since,remaining,status};\n  },[pmCfgIndex,selectedKey,pmReg,summary.currentH]);'''
          new='''  const pmInfo=useMemo(()=>{\n    const cfg=pmCfgIndex.get(selectedKey)||{};\n    const latestReg=pmReg[0]||null;\n    const lastH=Number(latestReg?pick(latestReg,["Horometro","Horómetro","Km / hs"]):pick(cfg,["horometroUltimoPM","Horómetro último PM"]))||0;\n    const lastDate=latestReg?pick(latestReg,["Fecha","Fecha PM"]):pick(cfg,["fechaUltimoPM","Fecha último PM"]);\n    const latestOp=op[op.length-1]||{};\n    const currentH=Number(latestOp.horometroFinal??latestOp.hf??latestOp.horometro??summary.currentH??0)||0;\n    const familyText=String(pick(master||{},["Familia","Tipo","Equipo"])||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();\n    const isTruck=/^CAMION(?:\\s|$)/.test(familyText);\n    const configuredInterval=Number(pick(cfg,["intervalo","Intervalo"]));\n    const interval=isTruck?500:(Number.isFinite(configuredInterval)&&configuredInterval>0?configuredInterval:250);\n    let next=0;\n    if(lastH){\n      if(isTruck&&currentH>0){\n        next=Math.ceil(currentH/500)*500;\n        if(next===currentH&&lastH>=currentH)next+=500;\n      }else{\n        next=lastH+interval;\n      }\n    }\n    const since=lastH&&currentH?Math.max(0,currentH-lastH):0;\n    const remaining=next&&currentH?next-currentH:null;\n    const inconsistent=!!(lastH&&currentH&&lastH>currentH);\n    let status="SIN BASE";\n    if(inconsistent)status="REVISAR DATOS";\n    else if(lastH)status=remaining!=null&&remaining<0?"ATRASADO":remaining!=null&&remaining<=Math.min(100,interval*0.2)?"PRÓXIMO":"AL DÍA";\n    return{lastH,lastDate,interval,next,since,remaining,status,currentH,isTruck,inconsistent};\n  },[pmCfgIndex,selectedKey,pmReg,op,master,summary.currentH]);'''
          if old not in s:
              raise SystemExit('EquipmentProfile pmInfo block not found')
          s=s.replace(old,new,1)
          old_metric='''{compactMetric("Horómetro actual",summary.currentH?`${fmt(summary.currentH)} h`:"—",C.blue,"Último horómetro final registrado en ROP02.",summary.lastOp?.fecha?`Última lectura: ${shortDate(summary.lastOp.fecha)}`:undefined,"hours")}'''
          new_metric='''{compactMetric("Horómetro actual",pmInfo.currentH?`${fmt(pmInfo.currentH)} h`:"—",C.blue,"Último horómetro final registrado en ROP02, sin limitarlo al período visual.",(op[op.length-1]?.fecha)?`Última lectura: ${shortDate(op[op.length-1].fecha)}`:undefined,"hours")}'''
          if old_metric not in s:
              raise SystemExit('EquipmentProfile current metric not found')
          s=s.replace(old_metric,new_metric,1)
          p.write_text(s,encoding='utf-8')

          # 3) PM module: trucks use horometer only, 500-hour milestones, camionetas excluded.
          p=Path('src/modules/mantenimiento/MantenimientoProgramadoView.jsx')
          s=p.read_text(encoding='utf-8')
          old='''function ropHoras(row) {\n  // Compatibilidad con datos normalizados (`horometroFinal`) y datos crudos (`HF`).\n  return Math.max(\n    num(row?.horometroFinal),\n    num(row?.horometroInicial),\n    num(pick(row, ["hf", "horometro final", "horómetro final", "km final", "kilometraje final"])),\n    num(pick(row, ["hi", "horometro inicial", "horómetro inicial"])),\n    num(row?.horas),\n    num(pick(row, ["horas", "hs"]))\n  );\n}'''
          new='''function ropHoras(row, esCamion = false) {\n  const horas = Math.max(\n    num(row?.horometroFinal),\n    num(row?.horometroInicial),\n    num(pick(row, ["hf", "horometro final", "horómetro final"])),\n    num(pick(row, ["hi", "horometro inicial", "horómetro inicial"])),\n    num(row?.horas),\n    num(pick(row, ["horas", "hs"]))\n  );\n  if (esCamion) return horas;\n  return Math.max(horas, num(row?.kilometrajeFinal), num(row?.kmFinal), num(pick(row, ["km final", "kilometraje final"])));\n}'''
          if old not in s:
              raise SystemExit('PM ropHoras block not found')
          s=s.replace(old,new,1)
          old='''function categoriaPM(equipo) {\n  return esCamionetaPM(equipo) ? "vehiculos" : "pesados";\n}'''
          new='''function esCamionPM(equipo) {\n  const familia=String(equipo?.familia||equipo?.tipoEquipo||equipo?.equipo||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();\n  return /^CAMION(?:\\s|$)/.test(familia);\n}\n\nfunction categoriaPM(equipo) {\n  return esCamionetaPM(equipo) ? "vehiculos" : "pesados";\n}'''
          if old not in s:
              raise SystemExit('PM categoria block not found')
          s=s.replace(old,new,1)
          anchor='''  const actividad7Dias = useMemo(() => {'''
          insert='''  const truckInternos = useMemo(() => {\n    const set = new Set();\n    (listaEquipos || []).forEach(raw => {\n      const e = equipoFromLista(raw);\n      if (esCamionPM(e)) {\n        const key = norm(e.interno);\n        if (key) set.add(key);\n      }\n    });\n    return set;\n  }, [listaEquipos]);\n\n  const actividad7Dias = useMemo(() => {'''
          if anchor not in s:
              raise SystemExit('PM actividad anchor not found')
          s=s.replace(anchor,insert,1)
          old_call='''      const horas = ropHoras(row);'''
          new_call='''      const horas = ropHoras(row, truckInternos.has(key));'''
          if old_call not in s:
              raise SystemExit('PM ropHoras call not found')
          s=s.replace(old_call,new_call,1)
          old_dep='''  }, [rop02All, fechaDesde, fechaHasta]);'''
          new_dep='''  }, [rop02All, fechaDesde, fechaHasta, truckInternos]);'''
          if old_dep not in s:
              raise SystemExit('PM actividad deps not found')
          s=s.replace(old_dep,new_dep,1)
          old_cfg='''      const cfg = configMap.get(key) || {};\n      base.push(statusFor({'''
          new_cfg='''      const cfg = configMap.get(key) || {};\n      const pmEsCamion = esCamionPM(e);\n      base.push(statusFor({'''
          if old_cfg not in s:
              raise SystemExit('PM cfg insertion point not found')
          s=s.replace(old_cfg,new_cfg,1)
          old_fields='''        proyecto: actividad.proyecto || cfg.proyecto || e.proyecto,\n        intervalo: num(cfg.intervalo) || DEFAULTS.intervalo,\n        alertaDesde: num(cfg.alertaDesde) || DEFAULTS.alertaDesde,\n        atrasadoDesde: num(cfg.atrasadoDesde) || DEFAULTS.atrasadoDesde,'''
          new_fields='''        proyecto: actividad.proyecto || cfg.proyecto || e.proyecto,\n        pmEsCamion,\n        intervalo: pmEsCamion ? 500 : (num(cfg.intervalo) > 0 ? num(cfg.intervalo) : DEFAULTS.intervalo),\n        alertaDesde: pmEsCamion ? 400 : (num(cfg.alertaDesde) || DEFAULTS.alertaDesde),\n        atrasadoDesde: pmEsCamion ? 500 : (num(cfg.atrasadoDesde) || DEFAULTS.atrasadoDesde),'''
          if old_fields not in s:
              raise SystemExit('PM fields block not found')
          s=s.replace(old_fields,new_fields,1)
          old_status='''  const intervalo = num(row.intervalo) || DEFAULTS.intervalo;\n  let estado = "AL DÍA", color = "ok";'''
          new_status='''  const intervalo = num(row.intervalo) > 0 ? num(row.intervalo) : DEFAULTS.intervalo;\n  const pmEsCamion = !!row.pmEsCamion;\n  const proximoPM = pmEsCamion && actual > 0\n    ? (() => { let target = Math.ceil(actual / 500) * 500; if (target === actual && ultimo >= actual) target += 500; return target; })()\n    : (ultimo ? ultimo + intervalo : 0);\n  let estado = "AL DÍA", color = "ok";'''
          if old_status not in s:
              raise SystemExit('PM status interval anchor not found')
          s=s.replace(old_status,new_status,1)
          old_return='''    proximoPM: ultimo ? ultimo + intervalo : 0,\n    faltan: ultimo ? Math.max(0, (ultimo + intervalo) - actual) : 0,'''
          new_return='''    proximoPM,\n    faltan: proximoPM ? Math.max(0, proximoPM - actual) : 0,'''
          if old_return not in s:
              raise SystemExit('PM status return anchor not found')
          s=s.replace(old_return,new_return,1)
          p.write_text(s,encoding='utf-8')

          # Regression tests for the exact business rule.
          Path('tests/pm-truck-business-rule.test.mjs').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nconst normalize=v=>String(v||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();\nconst isTruck=v=>/^CAMION(?:\\s|$)/.test(normalize(v));\nconst next=current=>Math.ceil(current/500)*500;\ntest("all truck families are trucks and camionetas are not",()=>{\n  for(const x of ["Camion","Camión regador","Camion volcador","Camion combustible","Camion tractor"])assert.equal(isTruck(x),true);\n  for(const x of ["Camioneta","Camioneta con mochila"])assert.equal(isTruck(x),false);\n});\ntest("1380 hours goes to 1500 hours",()=>assert.equal(next(1380),1500));\ntest("mileage does not define truck PM",()=>{const h=1380,km=126000;assert.equal(h,1380);assert.notEqual(km,h);});\n''',encoding='utf-8')
      - name: Validate tests and source
        run: npm run validate
      - name: Build production bundle
        run: npm run build
      - name: Commit only validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/globalTableColumnFilters.js src/modules/equipment/EquipmentProfileView.jsx src/modules/mantenimiento/MantenimientoProgramadoView.jsx tests/pm-truck-business-rule.test.mjs
          git commit -m "fix: PM truck 500h rule and dashboard layout"
          git push origin main
