name: PM baseline validation

on:
  push:
    branches: [fix/pm-final-20260914]
    paths:
      - '.github/workflows/pm-final-validate.yml'

jobs:
  validate-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Baseline validate
        id: check
        shell: bash
        run: |
          set +e
          npm run validate > baseline-validate.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          printf 'validate=%s\n' "$STATUS" > baseline-status.txt
          set -e
      - name: Upload baseline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-baseline-validation-logs
          path: |
            baseline-validate.log
            baseline-status.txt
      - name: Preserve baseline result
        if: steps.check.outputs.status != '0'
        run: exit 1
