name: One-off fix RABA chronological allocation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-fix-raba-allocation.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply chronological allocation fix
        run: python scripts/oneoff_fix_raba_allocation.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit validated change and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/abastecimiento/AbastecimientoModule.jsx
          git rm scripts/oneoff_fix_raba_allocation.py .github/workflows/oneoff-fix-raba-allocation.yml
          git commit -m 'Fix chronological RABA shipment allocation'
          git push origin main
