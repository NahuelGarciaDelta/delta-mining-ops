name: Validate mantenimiento runtime fix

on:
  push:
    branches: [diag/mantenimiento-keys-20260914]
    paths:
      - '.github/workflows/diag-mantenimiento-keys.yml'
      - 'scripts/vehicle-km-maintenance-vite-plugin.mjs'
      - 'scripts/pm-vehicle-scope-vite-plugin.mjs'
      - 'scripts/pm-vehicle-display-vite-plugin.mjs'
      - 'src/modules/mantenimiento/MantenimientoProgramadoView.jsx'
      - 'src/modules/mantenimiento/pmRules.js'
      - 'tests/pm-truck-rules.test.mjs'
      - 'tests/pm-vite-pipeline-regression.test.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: PM business and Vite pipeline regressions
        run: node --test tests/pm-truck-rules.test.mjs tests/pm-vite-pipeline-regression.test.mjs
      - name: Production build
        run: npm run build
