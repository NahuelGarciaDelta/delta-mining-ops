name: One-shot home availability update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-home-availability.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    env:
      OLD_B64: ""
      NEW_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch only Resumen General availability scope
        shell: bash
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('src/modules/home/ViewBienvenida.jsx')
          s = p.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if s.count(old) != 1:
              raise SystemExit(f'Expected availability block exactly once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/modules/home/ViewBienvenida.jsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/home/ViewBienvenida.jsx
          git commit -m "fix: include trucks in home availability states"
          git push origin HEAD:main
