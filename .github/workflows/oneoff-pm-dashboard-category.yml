name: One-off PM dashboard category filters
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted PM dashboard changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/modules/mantenimiento/MantenimientoProgramadoView.jsx')
          s=path.read_text(encoding='utf-8')

          anchor='function equipoFromLista(row) {\n'
          helper='''function esCamionetaPM(equipo) {\n  const familia = norm(equipo?.familia || equipo?.tipoEquipo || equipo?.equipo);\n  const interno = norm(equipo?.interno);\n  return familia.includes("CAMIONETA") || /^CTA\\d+/.test(interno);\n}\n\nfunction categoriaPM(equipo) {\n  return esCamionetaPM(equipo) ? "vehiculos" : "pesados";\n}\n\n'''
          if 'function esCamionetaPM(' not in s:
              assert anchor in s
              s=s.replace(anchor,helper+anchor,1)

          old='  const [equipoHistorial, setEquipoHistorial] = useState("");\n'
          new=old+'  const [usoCategoriaFiltro, setUsoCategoriaFiltro] = useState("pesados");\n  const [proximoCategoriaFiltro, setProximoCategoriaFiltro] = useState("pesados");\n'
          if 'usoCategoriaFiltro' not in s:
              assert old in s
              s=s.replace(old,new,1)

          old='  const configMap = useMemo(() => new Map(mergedConfigs.map(c => [norm(c.interno), c])), [mergedConfigs]);\n'
          new=old+'''  const categoriaPorInterno = useMemo(() => {\n    const map = new Map();\n    (listaEquipos || []).forEach(raw => {\n      const e = equipoFromLista(raw);\n      const key = norm(e.interno);\n      if (key) map.set(key, categoriaPM(e));\n    });\n    return map;\n  }, [listaEquipos]);\n'''
          if 'const categoriaPorInterno' not in s:
              assert old in s
              s=s.replace(old,new,1)

          old='''    const intervalosRealizados = registros.map(r => num(r.horasDesdeUltimoPM || r.intervaloReal || r.horasEntrePM)).filter(v => v > 0);\n    const promedioHs = intervalosRealizados.length\n      ? Math.round(intervalosRealizados.reduce((a, v) => a + v, 0) / intervalosRealizados.length)\n      : (conBase.length ? Math.round(conBase.reduce((a, x) => a + x.transcurridas, 0) / conBase.length) : 0);'''
          new='''    const intervalosRealizados = registros\n      .filter(r => categoriaPorInterno.get(norm(r.interno)) === "pesados")\n      .map(r => num(r.horasDesdeUltimoPM || r.intervaloReal || r.horasEntrePM))\n      .filter(v => v > 0);\n    const conBasePesados = conBase.filter(x => categoriaPM(x) === "pesados");\n    const promedioHs = intervalosRealizados.length\n      ? Math.round(intervalosRealizados.reduce((a, v) => a + v, 0) / intervalosRealizados.length)\n      : (conBasePesados.length ? Math.round(conBasePesados.reduce((a, x) => a + x.transcurridas, 0) / conBasePesados.length) : 0);'''
          assert old in s
          s=s.replace(old,new,1)

          old='''      .map(x => {\n        const min = x.transcurridas + 80;\n        const max = x.transcurridas + 120;'''
          new='''      .map(x => {\n        const esVehiculo = categoriaPM(x) === "vehiculos";\n        const incrementoMin = esVehiculo ? 80 : 8;\n        const incrementoMax = esVehiculo ? 120 : 12;\n        const min = x.transcurridas + incrementoMin;\n        const max = x.transcurridas + incrementoMax;'''
          assert old in s
          s=s.replace(old,new,1)

          old='  }, [visibles, registros, mergedConfigs, kpis, C, fechaHasta, mesFiltro, anioFiltro]);\n'
          new='  }, [visibles, registros, mergedConfigs, kpis, C, fechaHasta, mesFiltro, anioFiltro, categoriaPorInterno]);\n'
          assert old in s
          s=s.replace(old,new,1)

          anchor='  const actividadDiaria = useMemo(() => {\n'
          derived='''  const usoDesdePMFiltrado = useMemo(() => visibles\n    .filter(x => x.horometroUltimoPM > 0 && categoriaPM(x) === usoCategoriaFiltro)\n    .sort((a, b) => b.transcurridas - a.transcurridas)\n    .slice(0, 15), [visibles, usoCategoriaFiltro]);\n\n  const proximoTurnoFiltrado = useMemo(() => dashboard.proximoTurno\n    .filter(x => categoriaPM(x) === proximoCategoriaFiltro), [dashboard.proximoTurno, proximoCategoriaFiltro]);\n\n'''
          if 'const usoDesdePMFiltrado' not in s:
              assert anchor in s
              s=s.replace(anchor,derived+anchor,1)

          s=s.replace('tooltip="Promedio de la diferencia de horómetro entre PM consecutivos registrados para los equipos con historial suficiente."','tooltip="Promedio de horas entre PM calculado únicamente con equipos pesados (máquinas y camiones). Las camionetas se excluyen porque se controlan por kilometraje."',1)

          old='''        <Card title="Horas desde el último PM por equipo"><BarList rows={visibles.filter(x=>x.horometroUltimoPM>0).sort((a,b)=>b.transcurridas-a.transcurridas).slice(0,15).map(x=>[x.interno,x.transcurridas,statusColor[x.estado]])} max={Math.max(1,...visibles.map(x=>x.transcurridas||0))}/></Card>\n        <Card title="PM previstos para el próximo turno"><BarList rows={dashboard.proximoTurno.map(x=>[x.interno,x.proyMax,x.riesgo.includes("atrasado")?C?.red:C?.yellow])} max={Math.max(1,...dashboard.proximoTurno.map(x=>x.proyMax))}/></Card>'''
          new='''        <Card title="Uso desde el último PM por equipo">\n          <div style={{padding:"10px 12px 0",display:"flex",justifyContent:"flex-end"}}>\n            <select value={usoCategoriaFiltro} onChange={e=>setUsoCategoriaFiltro(e.target.value)} style={{...inputStyle,minWidth:180}}>\n              <option value="pesados">Equipos pesados</option>\n              <option value="vehiculos">Vehículos (camionetas)</option>\n            </select>\n          </div>\n          <BarList rows={usoDesdePMFiltrado.map(x=>[x.interno,x.transcurridas,statusColor[x.estado]])} max={Math.max(1,...usoDesdePMFiltrado.map(x=>x.transcurridas||0))}/>\n        </Card>\n        <Card title="PM previstos para el próximo turno">\n          <div style={{padding:"10px 12px 0",display:"flex",justifyContent:"flex-end"}}>\n            <select value={proximoCategoriaFiltro} onChange={e=>setProximoCategoriaFiltro(e.target.value)} style={{...inputStyle,minWidth:180}}>\n              <option value="pesados">Equipos pesados</option>\n              <option value="vehiculos">Vehículos (camionetas)</option>\n            </select>\n          </div>\n          <BarList rows={proximoTurnoFiltrado.map(x=>[x.interno,x.proyMax,x.riesgo.includes("atrasado")?C?.red:C?.yellow])} max={Math.max(1,...proximoTurnoFiltrado.map(x=>x.proyMax))}/>\n        </Card>'''
          assert old in s
          s=s.replace(old,new,1)

          for check in ['function esCamionetaPM(','categoriaPorInterno.get(norm(r.interno)) === "pesados"','const incrementoMin = esVehiculo ? 80 : 8;','value={usoCategoriaFiltro}','value={proximoCategoriaFiltro}']:
              assert check in s, check
          path.write_text(s,encoding='utf-8')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit validated change and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/mantenimiento/MantenimientoProgramadoView.jsx
          git rm .github/workflows/oneoff-pm-dashboard-category.yml
          git commit -m 'Fix PM dashboard hour and vehicle categories'
          git push origin main
