name: temp-abastecimiento-validate

on:
  push:
    branches:
      - fix/abastecimiento-938-salidas
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Test salida 938
        run: node --test --test-name-pattern="Ítems con salida" tests/abastecimiento-allocation-regression.test.mjs
      - name: Test promedio cerradas
        run: node --test --test-name-pattern="Promedio indicador" tests/abastecimiento-allocation-regression.test.mjs
      - name: Test Abastecimiento file
        run: node --test tests/abastecimiento-allocation-regression.test.mjs
      - name: Test full suite
        run: npm test
      - name: Build
        if: always()
        run: npm run build
