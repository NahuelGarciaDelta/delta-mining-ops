name: temp-validate-abastecimiento-appsscript

on:
  push:
    branches:
      - rollback/abastecimiento-appsscript

permissions:
  contents: write

jobs:
  validate:
    if: "startsWith(github.event.head_commit.message, 'ci: validate full Apps Script Abastecimiento path')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Apps Script-only transform
        run: python scripts/temp-disable-abastecimiento-supabase-transform.py
      - name: Verify transformed Abastecimiento stays on Apps Script
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { abastecimientoInstantVitePlugin } from './scripts/abastecimiento-instant-vite-plugin.mjs';
          const source=fs.readFileSync('./src/modules/abastecimiento/AbastecimientoModule.jsx','utf8');
          const plugin=abastecimientoInstantVitePlugin();
          const result=plugin.transform(source,'/repo/src/modules/abastecimiento/AbastecimientoModule.jsx');
          const code=result?.code||source;
          for(const action of ['action=raba03','action=remitos_cargados','action=estados_solicitudes','save_remito_cargado','save_raba03_cant_enviada','save_raba03_codigos']) assert.ok(code.includes(action),`Falta ${action}`);
          assert.ok(!code.includes('fetchRaba03FromSupabase'),'RABA03 fue reinyectado a Supabase');
          assert.ok(!code.includes('fetchAbastecimientoSnapshot'),'Remitos fueron reinyectados a Supabase');
          assert.ok(code.includes('label="Ítems con salida" value={fmtNum(d.cerradas+d.parciales)}'),'Se perdió 938=cerradas+parciales');
          assert.ok(code.includes('const indicadoresCerrados=filasActivas.filter('),'Se perdió indicador único por cerrado');
          assert.ok(code.includes('value:indicadoresCerrados.filter(r=>r.indicadorNum>15).length'),'Se perdió distribución por ítems únicos');
          console.log('OK: build transformado conserva Apps Script y reglas de dashboard.');
          NODE
      - name: Verify source transport and stock
        run: |
          test ! -f src/services/abastecimientoSupabase.js
          test ! -f src/services/supabaseClient.js
          ! grep -q '"@supabase/supabase-js"' package.json
          grep -q 'action=raba03' src/modules/abastecimiento/AbastecimientoModule.jsx
          grep -q 'action=remitos_cargados' src/modules/abastecimiento/AbastecimientoModule.jsx
          grep -q 'action=estados_solicitudes' src/modules/abastecimiento/AbastecimientoModule.jsx
          grep -q 'stock_excel_data' src/services/stockService.js
          grep -q 'stock_excel_upload' src/services/stockService.js
          grep -q 'stock_excel_replace' src/services/stockService.js
      - name: Live Apps Script read smoke test
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const proxy=fs.readFileSync('./api/apps-script.js','utf8');
          const m=proxy.match(/const APPS_SCRIPT_TARGET = ["']([^"']+)["']/);
          if(!m) throw new Error('No pude obtener APPS_SCRIPT_TARGET');
          const target=m[1];
          async function read(action,extra={}){
            const u=new URL(target); u.searchParams.set('action',action); u.searchParams.set('force','1'); u.searchParams.set('_',Date.now().toString());
            for(const [k,v] of Object.entries(extra))u.searchParams.set(k,String(v));
            const c=new AbortController(); const t=setTimeout(()=>c.abort(),60000);
            try{
              const r=await fetch(u,{redirect:'follow',cache:'no-store',signal:c.signal});
              const text=await r.text();
              if(!r.ok)throw new Error(`${action} HTTP ${r.status}: ${text.slice(0,160)}`);
              const j=JSON.parse(text); if(!j?.ok)throw new Error(`${action}: ${j?.error?.message||'ok=false'}`); return j;
            }finally{clearTimeout(t);}
          }
          const raba=await read('raba03',{limit:'all'});
          const rem=await read('remitos_cargados',{limit:'all'});
          const est=await read('estados_solicitudes',{limit:'all'});
          const rabaRows=Array.isArray(raba.data)?raba.data:(Array.isArray(raba?.sources?.raba03?.data)?raba.sources.raba03.data:[]);
          const remRows=Array.isArray(rem.data)?rem.data:[];
          const estRows=Array.isArray(est.data)?est.data:[];
          console.log(JSON.stringify({raba03:rabaRows.length,remitos:remRows.length,estados:estRows.length}));
          if(rabaRows.length<1200)throw new Error(`RABA03 incompleto: ${rabaRows.length}`);
          if(remRows.length<1)throw new Error('Remitos vacío');
          if(estRows.length<1)throw new Error('Estados vacío');
          NODE
      - name: Validate imports
        run: node scripts/validate-local-imports.mjs
      - name: Security audit
        run: npm run lint:security
      - name: Core Abastecimiento regressions
        run: node --test tests/abastecimiento-allocation-regression.test.mjs tests/enviosSinSolicitud.test.mjs tests/global-column-filters.test.mjs
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit functional rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/abastecimiento-instant-vite-plugin.mjs
          git commit -m "fix: keep Abastecimiento reads on Apps Script"
          git push
