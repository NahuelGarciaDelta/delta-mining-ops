name: Normalize month periods

on:
  push:
    paths:
      - '.github/workflows/normalize-month-periods.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply month period policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'No se encontró patrón requerido: {label}')
              return text.replace(old, new, 1)

          # 1) Regla global: mes calendario. El modo 26→25 queda opt-in.
          ui=Path('src/components/ui/index.jsx')
          s=ui.read_text(encoding='utf-8')
          pattern=r'export function PeriodMonthYear\(\{fechaD,fechaH,setFechaD,setFechaH\}\)\{.*?\n\}'
          replacement='''export function PeriodMonthYear({fechaD,fechaH,setFechaD,setFechaH,operational=false}){
  const fechaHStr=String(fechaH||"");
  const fechaDStr=String(fechaD||"");
  const selectedMonth=operational
    ? (fechaHStr.slice(8,10)==="25"?fechaHStr.slice(5,7):"")
    : (fechaDStr.slice(8,10)==="01"&&fechaHStr.slice(0,7)===fechaDStr.slice(0,7)?fechaDStr.slice(5,7):"");
  const selectedYear=selectedMonth
    ? (operational?fechaHStr.slice(0,4):fechaDStr.slice(0,4))
    : (fechaDStr?fechaDStr.slice(0,4):"");
  const apply=(year,month)=>{
    const now=new Date();
    const y=year||String(now.getFullYear());
    if(!month){
      setFechaD(`${y}-01-01`);
      setFechaH(`${y}-12-31`);
      return;
    }
    const targetYear=Number(y);
    const targetMonth=Number(month);
    const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(operational){
      const start=new Date(targetYear,targetMonth-2,26,12);
      const end=new Date(targetYear,targetMonth-1,25,12);
      setFechaD(iso(start));
      setFechaH(iso(end));
      return;
    }
    const start=new Date(targetYear,targetMonth-1,1,12);
    const end=new Date(targetYear,targetMonth,0,12);
    setFechaD(iso(start));
    setFechaH(iso(end));
  };
  const clearPeriodo=()=>{setFechaD("");setFechaH("");};
  return(
    <>
      <Sel label="Mes" value={selectedMonth} onChange={m=>m?apply(selectedYear,m):clearPeriodo()} options={MONTH_OPTIONS}/>
      <Sel label="Año" value={selectedYear} onChange={y=>y?apply(y,selectedMonth):clearPeriodo()} options={YEAR_OPTIONS}/>
    </>
  );
}'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se pudo reemplazar PeriodMonthYear')
          ui.write_text(s,encoding='utf-8')

          # 2) Horómetros + Calidad/ICHC conservan 26→25 mediante deps de ruta.
          route=Path('src/modules/oficina-tecnica/OficinaTecnicaRoute.jsx')
          s=route.read_text(encoding='utf-8')
          marker='''function mergeRop02Sources(baseRows,remoteRows){'''
          helper='''function buildOperationalPeriodDeps(deps){
  if(!deps?.PeriodMonthYear)return deps;
  const BasePeriodMonthYear=deps.PeriodMonthYear;
  const OperationalPeriodMonthYear=periodProps=><BasePeriodMonthYear {...periodProps} operational/>;
  return {...deps,PeriodMonthYear:OperationalPeriodMonthYear};
}

'''
          if helper not in s:
              s=must_replace(s,marker,helper+marker,'helper períodos operativos')
          old='''  const routedProps=useMemo(()=>{
    let nextProps=props;
    if(props?.view==="listaEquipos"){
      nextProps={...nextProps,rop02All:rop02Equipos};
    }
    if(atrasoView){
      nextProps={...nextProps,deps:buildAtrasoDeps(props.deps,{readOnly:readOnlyAtraso})};
    }
    return nextProps;
  },[props,rop02Equipos,atrasoView,readOnlyAtraso]);'''
          new='''  const routedProps=useMemo(()=>{
    let nextProps=props;
    if(props?.view==="listaEquipos"){
      nextProps={...nextProps,rop02All:rop02Equipos};
    }
    if(props?.view==="horometros"||props?.view==="chc"){
      nextProps={...nextProps,deps:buildOperationalPeriodDeps(nextProps.deps)};
    }
    if(atrasoView){
      nextProps={...nextProps,deps:buildAtrasoDeps(nextProps.deps,{readOnly:readOnlyAtraso})};
    }
    return nextProps;
  },[props,rop02Equipos,atrasoView,readOnlyAtraso]);'''
          s=must_replace(s,old,new,'routedProps períodos operativos')
          route.write_text(s,encoding='utf-8')

          # 3) Control de horas mensuales conserva 26→25 sin afectar Ranking.
          deps=Path('src/config/moduleDeps.jsx')
          s=deps.read_text(encoding='utf-8')
          anchor='''export const OPERATIONAL_ANALYTICS_DEPS = Object.freeze({
  C,Icon,Spinner,Badge,StatCard,Card,Table,Sel,MultiSel,DateIn,PeriodMonthYear,TabBtn,AlertBanner,HelpTip,
  fmtNum,fmtFecha,uniq,normDate,cleanMachine,canonicalEquivalentMachineCode,isRop02ControlMachineExcluded,dmMatchTipoMaquinaSeleccion,dmTipoMaquinaOptions,matchMulti,multiIsAll,multiIncludes,normalizeMachineCode,getMachineType,isExcluded,excelFromCols,proyColor,semaforo,appAlert
});'''
          addition=anchor+'''\n\nconst OperationalPeriodMonthYear = props => <PeriodMonthYear {...props} operational/>;\nexport const MONTHLY_HOURS_ANALYTICS_DEPS = Object.freeze({...OPERATIONAL_ANALYTICS_DEPS,PeriodMonthYear:OperationalPeriodMonthYear});'''
          s=must_replace(s,anchor,addition,'deps control horas mensual')
          deps.write_text(s,encoding='utf-8')

          app=Path('src/App.jsx')
          s=app.read_text(encoding='utf-8')
          old_import='''import { ABASTECIMIENTO_DEPS, COSTOS_UNITARIOS_DEPS, INFORME_COSTOS_DEPS, LICITACIONES_DEPS, MANTENIMIENTO_DEPS, OPERATIONAL_ANALYTICS_DEPS, createOficinaTecnicaDeps } from "./config/moduleDeps.jsx";'''
          new_import='''import { ABASTECIMIENTO_DEPS, COSTOS_UNITARIOS_DEPS, INFORME_COSTOS_DEPS, LICITACIONES_DEPS, MANTENIMIENTO_DEPS, MONTHLY_HOURS_ANALYTICS_DEPS, OPERATIONAL_ANALYTICS_DEPS, createOficinaTecnicaDeps } from "./config/moduleDeps.jsx";'''
          s=must_replace(s,old_import,new_import,'import deps mensual')
          s=must_replace(s,'<ViewCambiosTurno deps={OPERATIONAL_ANALYTICS_DEPS} rop02All={rop02All}/>','<ViewCambiosTurno deps={MONTHLY_HOURS_ANALYTICS_DEPS} rop02All={rop02All}/>','ViewCambiosTurno deps')
          app.write_text(s,encoding='utf-8')

          # 4) Prueba del contrato para evitar regresiones futuras.
          test=Path('tests/month-period-policy.test.mjs')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\ntest("mes calendario es la regla por defecto y 26-25 es opt-in",()=>{\n  const ui=fs.readFileSync("src/components/ui/index.jsx","utf8");\n  assert.match(ui,/PeriodMonthYear\(\{fechaD,fechaH,setFechaD,setFechaH,operational=false\}\)/);\n  assert.match(ui,/new Date\(targetYear,targetMonth-1,1,12\)/);\n  assert.match(ui,/new Date\(targetYear,targetMonth-2,26,12\)/);\n});\n\ntest("solo vistas mensuales operativas reciben modo 26-25",()=>{\n  const route=fs.readFileSync("src/modules/oficina-tecnica/OficinaTecnicaRoute.jsx","utf8");\n  const deps=fs.readFileSync("src/config/moduleDeps.jsx","utf8");\n  const app=fs.readFileSync("src/App.jsx","utf8");\n  assert.match(route,/view==="horometros"\|\|props\?\.view==="chc"/);\n  assert.match(deps,/MONTHLY_HOURS_ANALYTICS_DEPS/);\n  assert.match(app,/ViewCambiosTurno deps=\{MONTHLY_HOURS_ANALYTICS_DEPS\}/);\n});\n''',encoding='utf-8')

          Path('.github/workflows/normalize-month-periods.yml').unlink(missing_ok=True)
          PY
      - name: Validate
        run: npm ci && npm run validate && npm run build
      - name: Commit
        run: |
          git config user.name "Delta Mining OPS Automation"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Normalizar filtros mensuales por calendario"
          git push origin HEAD:main
