name: One-off home summary day filter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-home-summary-day.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply home summary day patch
        run: python scripts/oneoff_home_summary_day.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit validated change and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/home/ViewBienvenida.jsx src/modules/home/ViewBienvenidaProjectFilter.jsx
          git rm scripts/oneoff_home_summary_day.py .github/workflows/oneoff-home-summary-day.yml
          git commit -m 'Use latest ROP02 day in home summary'
          git push origin main
