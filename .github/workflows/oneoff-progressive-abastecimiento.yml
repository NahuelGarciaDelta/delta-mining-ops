name: One-off progressive Abastecimiento
on:
  push:
    branches: [main]
    paths:
      - 'scripts/oneoff_progressive_abastecimiento.py'
      - '.github/workflows/oneoff-progressive-abastecimiento.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply refactor
        run: python scripts/oneoff_progressive_abastecimiento.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit validated change and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/abastecimiento/AbastecimientoModule.jsx
          git rm scripts/oneoff_progressive_abastecimiento.py .github/workflows/oneoff-progressive-abastecimiento.yml
          git commit -m 'Paginate Abastecimiento tables 100 rows at a time'
          git push origin main
# trigger
