name: Finalize PM consistency fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-pm-fix-20260914.yml'
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch PM source
        shell: python
        run: |
          from pathlib import Path

          # Equipment detail
          p=Path('src/modules/equipment/EquipmentProfileView.jsx')
          s=p.read_text(encoding='utf-8')
          old='''  const pmInfo=useMemo(()=>{\n    const cfg=pmCfgIndex.get(selectedKey)||{};\n    const latestReg=pmReg[0]||null;\n    const lastH=Number(latestReg?pick(latestReg,["Horometro","Horómetro","Km / hs"]):pick(cfg,["horometroUltimoPM","Horómetro último PM"]))||0;\n    const lastDate=latestReg?pick(latestReg,["Fecha","Fecha PM"]):pick(cfg,["fechaUltimoPM","Fecha último PM"]);\n    const interval=Number(pick(cfg,["intervalo","Intervalo"]))||250;\n    const next=lastH?lastH+interval:0;\n    const since=lastH&&summary.currentH?Math.max(0,summary.currentH-lastH):0;\n    const remaining=next&&summary.currentH?next-summary.currentH:null;\n    let status="SIN BASE";if(lastH){status=remaining!=null&&remaining<0?"ATRASADO":remaining!=null&&remaining<=50?"PRÓXIMO":"AL DÍA";}\n    return{lastH,lastDate,interval,next,since,remaining,status};\n  },[pmCfgIndex,selectedKey,pmReg,summary.currentH]);'''
          new='''  const pmInfo=useMemo(()=>{\n    const cfg=pmCfgIndex.get(selectedKey)||{};\n    const latestReg=pmReg[0]||null;\n    const lastH=Number(latestReg?pick(latestReg,["Horometro","Horómetro","Km / hs"]):pick(cfg,["horometroUltimoPM","Horómetro último PM"]))||0;\n    const lastDate=latestReg?pick(latestReg,["Fecha","Fecha PM"]):pick(cfg,["fechaUltimoPM","Fecha último PM"]);\n    const latestOp=op[op.length-1]||{};\n    const currentH=Number(latestOp.horometroFinal??latestOp.hf??latestOp.horometro??summary.currentH??0)||0;\n    const familyText=String(pick(master||{},["Familia","Tipo","Equipo"])||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();\n    const isTruck=/^CAMION(?:\\s|$)/.test(familyText);\n    const configuredInterval=Number(pick(cfg,["intervalo","Intervalo"]));\n    const interval=isTruck?500:(Number.isFinite(configuredInterval)&&configuredInterval>0?configuredInterval:250);\n    let next=0;\n    if(lastH){\n      if(isTruck&&currentH>0){\n        next=Math.ceil(currentH/500)*500;\n        if(next===currentH&&lastH>=currentH)next+=500;\n      }else next=lastH+interval;\n    }\n    const since=lastH&&currentH?Math.max(0,currentH-lastH):0;\n    const remaining=next&&currentH?next-currentH:null;\n    const inconsistent=!!(lastH&&currentH&&lastH>currentH);\n    let status="SIN BASE";\n    if(inconsistent)status="REVISAR DATOS";\n    else if(lastH)status=remaining!=null&&remaining<0?"ATRASADO":remaining!=null&&remaining<=Math.min(100,interval*.2)?"PRÓXIMO":"AL DÍA";\n    return{lastH,lastDate,interval,next,since,remaining,status,currentH,isTruck,inconsistent,latestOp};\n  },[pmCfgIndex,selectedKey,pmReg,op,master,summary.currentH]);'''
          if old not in s: raise SystemExit('equipment pmInfo block not found')
          s=s.replace(old,new,1)
          old='''        {compactMetric("Horómetro actual",summary.currentH?`${fmt(summary.currentH)} h`:"—",C.blue,"Último horómetro final registrado en ROP02.",summary.lastOp?.fecha?`Última lectura: ${shortDate(summary.lastOp.fecha)}`:undefined,"hours")}'''
          new='''        {compactMetric("Horómetro actual",pmInfo.currentH?`${fmt(pmInfo.currentH)} h`:"—",C.blue,"Último horómetro final registrado en ROP02, sin limitarlo al período visual.",pmInfo.latestOp?.fecha?`Última lectura: ${shortDate(pmInfo.latestOp.fecha)}`:undefined,"hours")}'''
          if old not in s: raise SystemExit('equipment currentH card not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # PM module
          p=Path('src/modules/mantenimiento/MantenimientoProgramadoView.jsx')
          s=p.read_text(encoding='utf-8')
          old='''function categoriaPM(equipo) {\n  return esCamionetaPM(equipo) ? "vehiculos" : "pesados";\n}'''
          new='''function esCamionPM(equipo) {\n  const familia = String(equipo?.familia || equipo?.tipoEquipo || equipo?.equipo || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();\n  return /^CAMION(?:\\s|$)/.test(familia);\n}\n\nfunction categoriaPM(equipo) {\n  return esCamionetaPM(equipo) ? "vehiculos" : "pesados";\n}'''
          if old not in s: raise SystemExit('categoria block not found')
          s=s.replace(old,new,1)
          old='''function ropHoras(row) {\n  // Compatibilidad con datos normalizados (`horometroFinal`) y datos crudos (`HF`).\n  return Math.max(\n    num(row?.horometroFinal),\n    num(row?.horometroInicial),\n    num(pick(row, ["hf", "horometro final", "horómetro final", "km final", "kilometraje final"])),\n    num(pick(row, ["hi", "horometro inicial", "horómetro inicial"])),\n    num(row?.horas),\n    num(pick(row, ["horas", "hs"]))\n  );\n}'''
          new='''function ropHoras(row, esCamion = false) {\n  const horometro = Math.max(\n    num(row?.horometroFinal),\n    num(row?.horometroInicial),\n    num(pick(row, ["hf", "horometro final", "horómetro final"])),\n    num(pick(row, ["hi", "horometro inicial", "horómetro inicial"])),\n    num(row?.horas),\n    num(pick(row, ["horas", "hs"]))\n  );\n  if (esCamion) return horometro;\n  return Math.max(horometro, num(row?.kilometrajeFinal), num(row?.kmFinal), num(pick(row, ["km final", "kilometraje final"])));\n}'''
          if old not in s: raise SystemExit('ropHoras block not found')
          s=s.replace(old,new,1)
          old='''function statusFor(row) {\n  const actual = num(row.horometroActual);\n  const ultimo = num(row.horometroUltimoPM);\n  const transcurridas = ultimo > 0 ? Math.max(0, actual - ultimo) : 0;\n  const alerta = num(row.alertaDesde) || DEFAULTS.alertaDesde;\n  const atrasado = num(row.atrasadoDesde) || DEFAULTS.atrasadoDesde;\n  const intervalo = num(row.intervalo) || DEFAULTS.intervalo;\n  let estado = "AL DÍA", color = "ok";\n  const margenUrgente = Math.max(20, Math.min(50, atrasado - intervalo));\n  if (!ultimo) { estado = "SIN BASE"; color = "muted"; }\n  else if (transcurridas >= atrasado) { estado = "PM ATRASADO"; color = "danger"; }\n  else if (transcurridas >= intervalo || transcurridas >= atrasado - margenUrgente) { estado = "PM URGENTE"; color = "danger"; }\n  else if (transcurridas >= alerta) { estado = "PM PRÓXIMO"; color = "warn"; }\n  return {\n    ...row,\n    transcurridas,\n    proximoPM: ultimo ? ultimo + intervalo : 0,\n    faltan: ultimo ? Math.max(0, (ultimo + intervalo) - actual) : 0,\n    estado,\n    color,\n  };\n}'''
          new='''function statusFor(row) {\n  const actual = num(row.horometroActual);\n  const ultimo = num(row.horometroUltimoPM);\n  const transcurridas = ultimo > 0 ? Math.max(0, actual - ultimo) : 0;\n  const esCamion = !!row.pmEsCamion;\n  const alerta = esCamion ? 400 : (num(row.alertaDesde) || DEFAULTS.alertaDesde);\n  const atrasado = esCamion ? 500 : (num(row.atrasadoDesde) || DEFAULTS.atrasadoDesde);\n  const intervalo = esCamion ? 500 : (num(row.intervalo) > 0 ? num(row.intervalo) : DEFAULTS.intervalo);\n  let proximoPM = ultimo ? ultimo + intervalo : 0;\n  if (esCamion && actual > 0) {\n    proximoPM = Math.ceil(actual / 500) * 500;\n    if (proximoPM === actual && ultimo >= actual) proximoPM += 500;\n  }\n  let estado = "AL DÍA", color = "ok";\n  const margenUrgente = Math.max(20, Math.min(50, atrasado - intervalo));\n  if (!ultimo) { estado = "SIN BASE"; color = "muted"; }\n  else if (ultimo > actual && actual > 0) { estado = "REVISAR DATOS"; color = "warn"; }\n  else if (transcurridas >= atrasado) { estado = "PM ATRASADO"; color = "danger"; }\n  else if (transcurridas >= intervalo || transcurridas >= atrasado - margenUrgente) { estado = "PM URGENTE"; color = "danger"; }\n  else if (transcurridas >= alerta) { estado = "PM PRÓXIMO"; color = "warn"; }\n  return {\n    ...row,\n    intervalo,\n    transcurridas,\n    proximoPM,\n    faltan: proximoPM ? Math.max(0, proximoPM - actual) : 0,\n    estado,\n    color,\n  };\n}'''
          if old not in s: raise SystemExit('statusFor block not found')
          s=s.replace(old,new,1)
          anchor='''  const actividad7Dias = useMemo(() => {'''
          insert='''  const truckInternos = useMemo(() => {\n    const set = new Set();\n    (listaEquipos || []).forEach(raw => {\n      const e = equipoFromLista(raw);\n      if (esCamionPM(e)) {\n        const key = norm(e.interno);\n        if (key) set.add(key);\n      }\n    });\n    return set;\n  }, [listaEquipos]);\n\n  const actividad7Dias = useMemo(() => {'''
          if anchor not in s: raise SystemExit('actividad anchor not found')
          s=s.replace(anchor,insert,1)
          old='''      const horas = ropHoras(row);'''
          new='''      const horas = ropHoras(row, truckInternos.has(key));'''
          if old not in s: raise SystemExit('ropHoras invocation not found')
          s=s.replace(old,new,1)
          old='''  }, [rop02All, fechaDesde, fechaHasta]);'''
          new='''  }, [rop02All, fechaDesde, fechaHasta, truckInternos]);'''
          if old not in s: raise SystemExit('actividad deps not found')
          s=s.replace(old,new,1)
          old='''      const cfg = configMap.get(key) || {};\n      base.push(statusFor({'''
          new='''      const cfg = configMap.get(key) || {};\n      const pmEsCamion = esCamionPM(e);\n      base.push(statusFor({'''
          if old not in s: raise SystemExit('cfg anchor not found')
          s=s.replace(old,new,1)
          old='''        proyecto: actividad.proyecto || cfg.proyecto || e.proyecto,\n        intervalo: num(cfg.intervalo) || DEFAULTS.intervalo,\n        alertaDesde: num(cfg.alertaDesde) || DEFAULTS.alertaDesde,\n        atrasadoDesde: num(cfg.atrasadoDesde) || DEFAULTS.atrasadoDesde,'''
          new='''        proyecto: actividad.proyecto || cfg.proyecto || e.proyecto,\n        pmEsCamion,\n        intervalo: pmEsCamion ? 500 : (num(cfg.intervalo) > 0 ? num(cfg.intervalo) : DEFAULTS.intervalo),\n        alertaDesde: pmEsCamion ? 400 : (num(cfg.alertaDesde) || DEFAULTS.alertaDesde),\n        atrasadoDesde: pmEsCamion ? 500 : (num(cfg.atrasadoDesde) || DEFAULTS.atrasadoDesde),'''
          if old not in s: raise SystemExit('equipment fields anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Commit validated PM fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/equipment/EquipmentProfileView.jsx src/modules/mantenimiento/MantenimientoProgramadoView.jsx
          git commit -m "fix: enforce consistent truck PM horometer logic"
          git push origin main
