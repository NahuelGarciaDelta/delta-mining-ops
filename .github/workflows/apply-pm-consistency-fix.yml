name: Apply PM consistency fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pm-consistency-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Check patch script
        run: node --check scripts/apply-pm-consistency-fix.mjs
      - name: Apply corrections
        run: node scripts/apply-pm-consistency-fix.mjs
      - name: Validate
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/supabaseReadApi.js src/services/appsScriptApi.js src/modules/mantenimiento/MantenimientoProgramadoView.jsx src/modules/equipment/EquipmentProfileView.jsx
          git commit -m "fix: stabilize PM data and truck maintenance rules"
          git push origin main
