name: temp-performance-validation
on:
  push:
    branches: [feat/split-trucks-pickups-rop02]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify performance architecture
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const main=fs.readFileSync('src/main.jsx','utf8');
          const cache=fs.readFileSync('src/services/appCache.js','utf8');
          const search=fs.readFileSync('src/components/GlobalSearch.jsx','utf8');
          const filters=fs.readFileSync('src/services/globalTableColumnFilters.js','utf8');
          const admin=fs.readFileSync('src/services/administrativeTableExports.js','utf8');
          const mech=fs.readFileSync('src/services/mechanicRoleGuard.js','utf8');
          const vite=fs.readFileSync('vite.config.js','utf8');
          const fail=(m)=>{throw new Error(m)};
          if(!cache.includes('prewarmSavedDataSources'))fail('missing cache prewarm');
          if(!main.includes('prewarmSavedDataSources'))fail('main does not prewarm cache');
          if(!main.includes('preloadFrequentModules'))fail('missing idle module preload');
          if(!search.includes('if(!open)return STATIC_INDEX'))fail('global search still indexes while closed');
          if(filters.includes('document.addEventListener("click"'))fail('legacy table filters still rescan on every click');
          if(admin.includes('document.addEventListener("click"'))fail('admin exports still rescan on every click');
          if(admin.startsWith('import * as XLSX'))fail('xlsx still eagerly loaded by admin exporter');
          if(!mech.includes('if(!isMechanic())return;'))fail('mechanic observer still scans all roles');
          if(vite.includes('rolldownOptions'))fail('wrong Vite build option still present');
          if(!vite.includes('rollupOptions'))fail('rollupOptions missing');
          console.log('performance architecture markers OK');
          NODE
      - name: Focused regressions
        run: node --test tests/rop02-truck-history.test.mjs tests/rop02-all-trucks-same.test.mjs tests/rop02-trucks-pickups-split.test.mjs tests/rop02-duplicate-loads.test.mjs
      - name: Build normal
        run: npm run build
      - name: Report chunks
        run: |
          find dist/assets -maxdepth 1 -type f -name '*.js' -printf '%f %s bytes\n' | sort -k2 -n
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'react-vendor-*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'charts-vendor-*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'xlsx-vendor-*.js' -print -quit)"
      - name: Convert all src to CRLF
        run: |
          python - <<'PY'
          from pathlib import Path
          exts={'.js','.jsx','.ts','.tsx'}
          for p in Path('src').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              raw=p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n')
              p.write_bytes(raw.replace(b'\n',b'\r\n'))
          PY
      - name: Build CRLF Windows simulation
        run: npm run build
      - run: git checkout -- src
      - name: Validate local imports
        run: node scripts/validate-local-imports.mjs
      - name: Security audit
        run: npm run lint:security
      - name: Diff check
        run: git diff --check
