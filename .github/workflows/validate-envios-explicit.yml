name: Validate envios sin solicitud

on:
  push:
    branches:
      - fix/envios-sin-solicitud-explicit-links-20260914

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Targeted envios tests
        run: node --test tests/enviosSinSolicitud.test.mjs
      - name: Production build
        run: npm run build
      - name: Full regression suite
        continue-on-error: true
        run: npm test
