name: Validate envios sin solicitud

on:
  push:
    branches:
      - fix/envios-sin-solicitud-explicit-links-20260914

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run build
