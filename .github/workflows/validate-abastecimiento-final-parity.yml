name: Diagnose exact Abastecimiento parity

on:
  push:
    branches: [fix/abastecimiento-supabase-parity-unmatched-20260914]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: node --test tests/abastecimiento-allocation-regression.test.mjs tests/enviosSinSolicitud.test.mjs
      - name: Diagnose historical sent-by-code model
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const api=fs.readFileSync('src/services/raba03ReadApi.js','utf8');
          const url=(api.match(/https:\/\/[^"']+\.supabase\.co/)||[])[0];
          const key=(api.match(/sb_publishable_[A-Za-z0-9_-]+/)||[])[0];
          if(!url||!key)throw new Error('No se pudo leer URL/key pública de Supabase');
          const norm=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const normCode=v=>String(v??'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'').trim();
          const project=v=>{const t=norm(v),c=t.replace(/\s+/g,'');if(t.includes('jose maria')||c.includes('josemaria'))return 'JOSE MARIA';if(t.includes('filo del sol')||c.includes('filodelsol'))return 'FILO DEL SOL';return String(v??'').trim().toUpperCase();};
          const isoDate=v=>{const s=String(v??'').trim();const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return `${iso[1]}-${iso[2]}-${iso[3]}`;const dm=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);if(dm){let y=+dm[3];if(y<100)y+=2000;return `${y}-${String(+dm[2]).padStart(2,'0')}-${String(+dm[1]).padStart(2,'0')}`;}return s.slice(0,10);};
          const dateMs=v=>{const s=String(v??'').trim();if(!s)return 0;const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]).getTime();const d=new Date(s);return Number.isNaN(d.getTime())?0:d.getTime();};
          const num=v=>{const t=String(v??0).trim().replace(/\./g,'').replace(',','.');const n=Number(t);return Number.isFinite(n)?n:0;};
          const res=await fetch(url+'/rest/v1/rpc/abastecimiento_snapshot',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:'{}'});
          if(!res.ok)throw new Error('snapshot HTTP '+res.status);
          const snap=await res.json();
          const rejected=new Set(), manualClosed=new Set();
          for(const e of (snap.estados||[])){const st=String(e.ESTADO||'').toUpperCase(),k=String(e.CLAVE_SOLICITUD||'').trim();if(!k)continue;if(st==='RECHAZADA')rejected.add(k);if(st==='CERRADA_MANUAL')manualClosed.add(k);}

          const sentMap={};
          const shipments=[];
          for(const r of (snap.remitos||[])){
            const code=normCode(r.CODIGO_ARTICULO), p=project(r.PROYECTO||r.OBSERVACIONES||r.DESTINO||r.ORIGEN), qty=num(r.CANTIDAD_ENVIADA), date=dateMs(r.FECHA_REMITO);
            if(!code||qty<=0)continue;
            const k=p?`${code}__${p}`:`${code}__*`;
            sentMap[k]=(sentMap[k]||0)+qty;
            shipments.push({code,p,qty,date});
          }

          const requests=(snap.raba03||[]).map((r,i)=>{
            const code=normCode(r['Código de articulo']||r['Código de artículo']);
            const p=project(r['Centro de Costo']);
            const d=r['Fecha de solicitud']||'';
            const pedido=String(r['N° de pedido']||r['N° de solicitud']||'').trim();
            const stable=`${normCode(pedido)}|${code}|${isoDate(d)}`;
            const qty=num(r['Cant. Solicitada']||r['Cantidad']);
            const sent=(sentMap[`${code}__${p}`]||0)+(sentMap[`${code}__*`]||0);
            return {i,code,p,date:dateMs(d),qty,sent,rest:Math.max(0,qty-sent),stable};
          }).filter(r=>r.code&&r.p);

          const active=requests.filter(r=>!rejected.has(r.stable));
          const pending=active.filter(r=>r.sent<=0).length;
          const partial=active.filter(r=>r.sent>0&&r.rest>0&&!manualClosed.has(r.stable)).length;
          const closed=active.filter(r=>r.qty>0&&(r.rest<=0||manualClosed.has(r.stable))).length;

          const validHistory=active.map(r=>({code:r.code,p:r.p,date:r.date}));
          let unmatchedLines=0;
          for(const s of shipments){if(!validHistory.some(r=>r.code===s.code&&(!s.p||!r.p||r.p===s.p)&&(!r.date||!s.date||r.date<=s.date)))unmatchedLines++;}
          const metrics={pending,partial,closed,rejected:requests.filter(r=>rejected.has(r.stable)).length,unmatchedLines};
          console.log('HISTORICAL_SENT_BY_CODE '+JSON.stringify(metrics));
          NODE
