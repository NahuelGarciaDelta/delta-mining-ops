name: Validate exact Abastecimiento parity

on:
  push:
    branches: [fix/abastecimiento-supabase-parity-unmatched-20260914]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: node --test tests/abastecimiento-allocation-regression.test.mjs tests/enviosSinSolicitud.test.mjs
      - name: Validate exact dashboard counts from current snapshot
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const api=fs.readFileSync('src/services/raba03ReadApi.js','utf8');
          const url=(api.match(/https:\/\/[^"']+\.supabase\.co/)||[])[0];
          const key=(api.match(/sb_publishable_[A-Za-z0-9_-]+/)||[])[0];
          if(!url||!key)throw new Error('No se pudo leer URL/key pública de Supabase');
          const norm=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const normCode=v=>String(v??'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'').trim();
          const project=v=>{const t=norm(v),c=t.replace(/\s+/g,'');if(t.includes('jose maria')||c.includes('josemaria'))return 'JOSE MARIA';if(t.includes('filo del sol')||c.includes('filodelsol'))return 'FILO DEL SOL';return String(v??'').trim().toUpperCase();};
          const dateMs=v=>{const s=String(v??'').trim();if(!s)return 0;const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]).getTime();const dm=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);if(dm){let y=+dm[3];if(y<100)y+=2000;return new Date(y,+dm[2]-1,+dm[1]).getTime();}const d=new Date(s);return Number.isNaN(d.getTime())?0:d.getTime();};
          const isoDate=v=>{const s=String(v??'').trim();const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return `${iso[1]}-${iso[2]}-${iso[3]}`;const dm=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);if(dm){let y=+dm[3];if(y<100)y+=2000;return `${y}-${String(+dm[2]).padStart(2,'0')}-${String(+dm[1]).padStart(2,'0')}`;}return s.slice(0,10);};
          const num=v=>{const t=String(v??0).trim().replace(/\./g,'').replace(',','.');const n=Number(t);return Number.isFinite(n)?n:0;};
          const res=await fetch(url+'/rest/v1/rpc/abastecimiento_snapshot',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:'{}'});
          if(!res.ok)throw new Error('snapshot HTTP '+res.status);
          const snap=await res.json();
          const rejected=new Set(), manualClosed=new Set();
          for(const e of (snap.estados||[])){const st=String(e.ESTADO||'').toUpperCase(),k=String(e.CLAVE_SOLICITUD||'').trim();if(!k)continue;if(st==='RECHAZADA')rejected.add(k);if(st==='CERRADA_MANUAL')manualClosed.add(k);}
          const raw=(snap.raba03||[]).filter(r=>{
            const empresa=String(r['Empresa']||'').trim();
            const values=[empresa,r['Fecha de solicitud'],r['Fecha requerida del producto'],r['Pedido por'],r['Centro de Costo'],r['Código de articulo']||r['Código de artículo'],r['Descripción de lo que se pidio']||r['Descripción de lo que se pidió'],r['Cant. Solicitada']];
            return values.some(v=>String(v??'').trim())&&!empresa.toLowerCase().includes('aprobado')&&!empresa.toLowerCase().includes('empresa');
          });
          const requests=raw.map((r,i)=>{const code=normCode(r['Código de articulo']||r['Código de artículo']);const p=project(r['Centro de Costo']);const d=r['Fecha de solicitud']||'';const pedido=String(r['N° de pedido']||r['N° de solicitud']||'').trim();return{i,code,p,date:dateMs(d),qty:num(r['Cant. Solicitada']||r['Cantidad']),stable:`${normCode(pedido)}|${code}|${isoDate(d)}`,sent:0};}).filter(r=>r.code&&r.p);
          const byKey=new Map();for(const r of requests){const k=`${r.code}__${r.p}`;if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(r);}for(const q of byKey.values())q.sort((a,b)=>(a.date||0)-(b.date||0)||a.i-b.i);
          const shipments=(snap.remitos||[]).map((r,i)=>({i,code:normCode(r.CODIGO_ARTICULO),p:project(r.PROYECTO||r.OBSERVACIONES||r.DESTINO||r.ORIGEN),date:dateMs(r.FECHA_REMITO),qty:num(r.CANTIDAD_ENVIADA)})).filter(r=>r.code&&r.p&&r.qty>0).sort((a,b)=>(a.date||0)-(b.date||0)||a.i-b.i);
          for(const s of shipments){let remain=s.qty;const q=byKey.get(`${s.code}__${s.p}`)||[];for(const r of q){if(remain<=0)break;if(r.date&&s.date&&r.date>s.date)continue;const pend=Math.max(0,r.qty-r.sent);if(!pend)continue;const used=Math.min(pend,remain);r.sent+=used;remain-=used;}}
          const active=requests.filter(r=>!rejected.has(r.stable));
          const pending=active.filter(r=>r.sent<=0).length;
          const partial=active.filter(r=>r.sent>0&&Math.max(0,r.qty-r.sent)>0&&!manualClosed.has(r.stable)).length;
          const closed=active.filter(r=>r.qty>0&&(Math.max(0,r.qty-r.sent)<=0||manualClosed.has(r.stable))).length;
          const validHistory=active.map(r=>({code:r.code,p:r.p,date:r.date}));let unmatchedLines=0;for(const s of shipments){if(!validHistory.some(r=>r.code===s.code&&(!s.p||!r.p||r.p===s.p)&&(!r.date||!s.date||r.date<=s.date)))unmatchedLines++;}
          const metrics={visibleRows:requests.length,pending,partial,closed,rejected:requests.filter(r=>rejected.has(r.stable)).length,unmatchedLines};
          console.log('ABASTECIMIENTO_FINAL '+JSON.stringify(metrics));
          if(pending!==308||partial!==60||closed!==865||metrics.rejected!==68){throw new Error('No coincide con dashboard Supabase esperado: '+JSON.stringify(metrics));}
          if(unmatchedLines<=0)throw new Error('Envíos sin solicitud debe ser mayor a cero');
          NODE
      - name: Production build
        run: npm run build
