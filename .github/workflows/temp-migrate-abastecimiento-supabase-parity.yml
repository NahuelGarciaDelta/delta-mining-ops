name: temp-migrate-abastecimiento-supabase-parity

on:
  push:
    branches:
      - migration/abastecimiento-supabase-parity-v2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Clone Supabase reference
        run: git clone --depth 1 https://github.com/NahuelGarciaDelta/delta-mining-web-supabase.git /tmp/delta-supabase
      - name: Apply migration
        run: python scripts/temp-migrate-abastecimiento.py
      - name: Install
        run: npm ci
      - name: Validate imports
        run: node scripts/validate-local-imports.mjs
      - name: Abastecimiento tests
        run: node --test tests/abastecimiento-allocation-regression.test.mjs tests/abastecimiento-envios-parity.test.mjs tests/abastecimiento-regression.test.mjs tests/enviosSinSolicitud.test.mjs tests/global-column-filters.test.mjs
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-migrate-abastecimiento-supabase-parity.yml scripts/temp-migrate-abastecimiento.py
          git add -A
          git commit -m "feat: migrate Abastecimiento to Supabase-first parity"
          git push origin HEAD:migration/abastecimiento-supabase-parity-v2
