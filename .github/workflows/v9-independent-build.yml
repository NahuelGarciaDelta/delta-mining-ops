name: V9 independiente - interfaz Delta OPS original
on:
  push:
    branches:
      - feature/v9-ops-supabase-app-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-v9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validar configuración V9 aislada
        run: |
          node --check vite.v9.config.js
          node --check api/v9-independent.js
          node --check api/v9-blocked.js
          test -f src/main.v9.jsx
          grep -F 'import App from "./App.jsx"' src/main.v9.jsx
          grep -F '/src/main.v9.jsx' v9.html
      - name: Compilar la interfaz original de Delta OPS con backend V9
        run: npm run build -- --config vite.v9.config.js
      - name: Verificar salida y bloquear dependencias V8.1
        run: |
          test -s dist/v9.html
          test -d dist/assets
          if grep -R -E 'jwfocqaxlckuxoklwyxs|XZAcQcWEDdgtZY_NWADy1g_HxoV0UZ2' dist/assets; then
            echo "ERROR: el bundle V9 contiene dependencias de producción V8.1"
            exit 1
          fi
          if grep -R -F '/api/apps-script' dist/assets; then
            echo "ERROR: el bundle V9 contiene la ruta Apps Script original"
            exit 1
          fi
