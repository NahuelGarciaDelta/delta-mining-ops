name: temp-diag-abastecimiento-619
on:
  push:
    branches: [fix/abastecimiento-remito-sync-loading]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose live Apps Script data
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const proxy=fs.readFileSync('./api/apps-script.js','utf8');
          const m=proxy.match(/const APPS_SCRIPT_TARGET = ["']([^"']+)["']/);
          if(!m) throw new Error('No pude obtener APPS_SCRIPT_TARGET');
          const target=m[1];
          async function read(action,extra={}){
            const u=new URL(target); u.searchParams.set('action',action); u.searchParams.set('force','1'); u.searchParams.set('_',Date.now().toString());
            for(const [k,v] of Object.entries(extra))u.searchParams.set(k,String(v));
            const c=new AbortController(); const t=setTimeout(()=>c.abort(),60000);
            try{
              const r=await fetch(u,{redirect:'follow',cache:'no-store',signal:c.signal});
              const text=await r.text();
              if(!r.ok) throw new Error(`${action} HTTP ${r.status}: ${text.slice(0,200)}`);
              const j=JSON.parse(text); if(!j?.ok) throw new Error(`${action}: ${j?.error?.message||'ok=false'}`); return j;
            } finally {clearTimeout(t);}
          }
          const raba=await read('raba03',{limit:'all'});
          const rem=await read('remitos_cargados',{limit:'all'});
          const rabaRows=Array.isArray(raba.data)?raba.data:(Array.isArray(raba?.sources?.raba03?.data)?raba.sources.raba03.data:[]);
          const remRows=Array.isArray(rem.data)?rem.data:[];
          const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/\s+/g,' ');
          const normCode=s=>norm(s).replace(/[^A-Z0-9]/g,'');
          const pick=(o,names)=>{for(const n of names){const k=Object.keys(o||{}).find(k=>norm(k)===norm(n)); if(k!==undefined)return o[k];} return ''};
          const projectOf=x=>{const s=norm(x); if(s.includes('JOSE MARIA')||s==='JM')return 'JOSE MARIA'; if(s.includes('FILO'))return 'FILO DEL SOL'; return s;};
          const code='1527ALT';
          const r619=remRows.filter(r=>norm(pick(r,['N_REMITO','nRemito','comprobante']))==='619');
          console.log('R619_ROWS',JSON.stringify(r619,null,2));
          const raba1527=rabaRows.filter(r=>normCode(pick(r,['Código de articulo','Código de artículo','Codigo de articulo','Código artículo','Código','Codigo']))===normCode(code));
          console.log('RABA1527_COUNT',raba1527.length);
          console.log('RABA1527',JSON.stringify(raba1527,null,2));
          const keys=Object.keys(rabaRows[0]||{});
          console.log('RABA_KEYS',JSON.stringify(keys));
          const withSalida=rabaRows.filter(r=>String(pick(r,['Fecha de salida','Fecha salida'])||'').trim()).length;
          const withRemito=rabaRows.filter(r=>String(pick(r,['Nº Remito','N° Remito','Remito'])||'').trim()).length;
          const withEnviada=rabaRows.filter(r=>Number(String(pick(r,['Cant. Enviada','Cantidad enviada','Cant enviada'])||0).replace(',','.'))>0).length;
          console.log('RABA_FIELD_COUNTS',JSON.stringify({rows:rabaRows.length,withSalida,withRemito,withEnviada}));
          const remItems=r619.map(r=>({
            id:pick(r,['ID_REMITO','idRemito','id']),
            remito:pick(r,['N_REMITO','nRemito','comprobante']),
            fecha:pick(r,['FECHA_REMITO','fechaRemito','fecha']),
            proyecto:projectOf(pick(r,['PROYECTO','proyecto'])||pick(r,['OBSERVACIONES','observaciones'])||pick(r,['DESTINO','destino'])||pick(r,['ORIGEN','origen'])),
            codigo:pick(r,['CODIGO_ARTICULO','codigoArticulo','codigo']),
            descripcion:pick(r,['DESCRIPCION','descripcion']),
            cantidad:pick(r,['CANTIDAD_ENVIADA','cantidadEnviada','cantidad'])
          })).filter(x=>normCode(x.codigo)===normCode(code));
          console.log('R619_1527',JSON.stringify(remItems,null,2));
          for(const item of remItems){
            const candidates=raba1527.map(r=>({
              pedido:pick(r,['N° de pedido','Nº de pedido','N de pedido','Numero de pedido','Número de pedido']),
              solicitud:pick(r,['N° de solicitud','Nº de solicitud','Solicitud']),
              fecha:pick(r,['Fecha de solicitud','Fecha solicitud']),
              proyecto:projectOf(pick(r,['Centro de Costo','Centro de costo','Proyecto','CC'])),
              descripcion:pick(r,['Descripción de lo que se pidio','Descripción de lo que se pidió','Descripcion de lo que se pidio','Descripción','Descripcion']),
              solicitada:pick(r,['Cant. Solicitada','Cantidad solicitada']),
              enviada:pick(r,['Cant. Enviada','Cantidad enviada']),
              remito:pick(r,['Nº Remito','N° Remito','Remito']),
              salida:pick(r,['Fecha de salida','Fecha salida']),
              projectMatch:projectOf(pick(r,['Centro de Costo','Centro de costo','Proyecto','CC']))===item.proyecto,
              descMatch:norm(pick(r,['Descripción de lo que se pidio','Descripción de lo que se pidió','Descripcion de lo que se pidio','Descripción','Descripcion']))===norm(item.descripcion)
            }));
            console.log('CANDIDATES_FOR_ITEM',JSON.stringify({item,candidates},null,2));
          }
          NODE
