name: temp-split-trucks-pickups-rop02
on:
  push:
    branches: [feat/split-trucks-pickups-rop02]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Split trucks/pickups regression tests
        run: node --test tests/rop02-trucks-pickups-split.test.mjs tests/rop02-duplicate-loads.test.mjs
      - name: Validate normal build
        run: npm run build
      - name: Convert all source files to Windows CRLF
        run: |
          python - <<'PY'
          from pathlib import Path
          exts={'.js','.jsx','.ts','.tsx'}
          for p in Path('src').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              raw=p.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n')
              p.write_bytes(raw.replace(b'\n',b'\r\n'))
          PY
      - name: Validate full build with Windows CRLF source
        run: npm run build
      - name: Restore source after CRLF simulation
        run: git checkout -- src
      - name: Validate imports
        run: node scripts/validate-local-imports.mjs
      - name: Security audit
        run: npm run lint:security
      - name: Diff check
        run: git diff --check
