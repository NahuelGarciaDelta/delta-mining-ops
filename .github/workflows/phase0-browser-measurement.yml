name: Phase 0 Performance Measurements

on:
  push:
    branches:
      - phase0-performance-measurement
    paths:
      - ".github/workflows/phase0-browser-measurement.yml"
      - "scripts/phase0-browser-measurement.mjs"
      - "scripts/phase0-production-measurement.mjs"
      - "scripts/phase0-bundle-metrics.mjs"
      - "src/services/performanceDiagnostics.js"
      - "src/services/refreshManager.js"
      - "scripts/phase0-performance-diagnostics-vite-plugin.mjs"
      - "vite.config.js"
  workflow_dispatch:
    inputs:
      mode:
        description: "production, phase1b-ab-local or phase1c-cpu-profile"
        required: false
        default: "production"

permissions:
  contents: read
  deployments: read

concurrency:
  group: phase0-performance-measurements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-metrics:
    name: Bundle metrics
    if: ${{ inputs.mode != 'phase1b-ab-local' && inputs.mode != 'phase1c-cpu-profile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout instrumented branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build instrumented app
        env:
          VITE_DM_PERF_DIAGNOSTICS: "1"
        run: npm run build

      - name: Measure bundle and gzip sizes
        run: node scripts/phase0-bundle-metrics.mjs

      - name: Upload bundle metrics
        uses: actions/upload-artifact@v4
        with:
          name: phase0-bundle-metrics
          path: |
            artifacts/phase0/bundle-metrics.json
            artifacts/phase0/bundle-metrics.csv
          retention-days: 14

  browser-metrics:
    name: Browser cold warm and slow measurements
    if: ${{ inputs.mode != 'phase1b-ab-local' && inputs.mode != 'phase1c-cpu-profile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DM_PERF_EMAIL: ${{ secrets.DM_PERF_EMAIL }}
      DM_PERF_PASSWORD: ${{ secrets.DM_PERF_PASSWORD }}
      DM_PERF_RUN_SLOW: "1"
    steps:
      - name: Checkout measurement branch
        uses: actions/checkout@v4

      - name: Check measurement credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$DM_PERF_EMAIL" ] && [ -n "$DM_PERF_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Secrets de medición disponibles."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No se ejecutará navegación autenticada hasta configurar DM_PERF_EMAIL y DM_PERF_PASSWORD."
          fi

      - name: Resolve reachable production URL
        if: steps.credentials.outputs.available == 'true'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase0
          candidates=""

          deployments="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/deployments?ref=main&per_page=50" 2>/dev/null || echo '[]')"
          ids="$(printf '%s' "$deployments" | jq -r '.[].id' 2>/dev/null || true)"
          for id in $ids; do
            statuses="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=20" 2>/dev/null || echo '[]')"
            urls="$(printf '%s' "$statuses" | jq -r '.[] | select(.state == "success") | .environment_url // empty' 2>/dev/null || true)"
            if [ -n "$urls" ]; then
              candidates="$candidates"$'\n'"$urls"
            fi
          done

          candidates="$candidates"$'\n'https://delta-mining-ops.vercel.app$'\n'https://deltaminingops.vercel.app
          selected=""
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            candidate="${candidate%/}"
            code="$(curl -L -sS --max-time 20 -o /tmp/phase0-candidate.html -w '%{http_code}' "${candidate}/" || echo 000)"
            host="$(node -e 'try{console.log(new URL(process.argv[1]).host)}catch{console.log("invalid")}' "$candidate")"
            echo "Candidato $host -> HTTP $code"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null && grep -qi "root\|DELTA MINING\|Correo electrónico" /tmp/phase0-candidate.html; then
              selected="$candidate"
              break
            fi
          done <<< "$(printf '%s\n' "$candidates" | awk 'NF && !seen[$0]++')"

          if [ -z "$selected" ]; then
            echo "No se encontró una URL pública y accesible de producción." | tee artifacts/phase0/production-resolution-error.txt
            exit 1
          fi

          echo "base_url=$selected" >> "$GITHUB_OUTPUT"
          host="$(node -e 'console.log(new URL(process.argv[1]).host)' "$selected")"
          echo "Producción resuelta: $host"
          printf '%s\n' "$host" > artifacts/phase0/production-host.txt

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      - name: Install Playwright runner without changing repository lockfile
        if: steps.credentials.outputs.available == 'true'
        run: npm install --no-save --package-lock=false playwright@1.49.1

      - name: Install Chromium
        if: steps.credentials.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production performance battery
        if: steps.credentials.outputs.available == 'true'
        env:
          DM_PERF_BASE_URL: ${{ steps.production.outputs.base_url }}
        run: node scripts/phase0-production-measurement.mjs

      - name: Record why browser battery was skipped
        if: steps.credentials.outputs.available != 'true'
        shell: bash
        run: |
          mkdir -p artifacts/phase0
          cat > artifacts/phase0/browser-measurement-skipped.txt <<'EOF'
          La batería autenticada de Fase 0 no se ejecutó porque el repositorio todavía no tiene disponibles los GitHub Actions Secrets DM_PERF_EMAIL y DM_PERF_PASSWORD.
          No se requieren ni deben guardarse credenciales dentro del código o de los artifacts.
          EOF

      - name: Upload browser metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-browser-metrics
          path: artifacts/phase0/
          if-no-files-found: warn
          retention-days: 14

  phase1b-local-ab:
    name: Phase 1B local frontend A B
    if: ${{ inputs.mode == 'phase1b-ab-local' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DM_PERF_EMAIL: ${{ secrets.DM_PERF_EMAIL }}
      DM_PERF_PASSWORD: ${{ secrets.DM_PERF_PASSWORD }}
      BASELINE_COMMIT: 8a9bc2fa995de958f1a79a285d253130815cbbbb
      CANDIDATE_COMMIT: 26b07f0e54b00a1b83d8c31d0528d2481aa0a67c
      CANDIDATE_ORIGINAL_LOCAL_COMMIT: ded5921105e51d0d7eacc3fe20623a96d15690f1
      CANDIDATE_FUNCTIONAL_BASE_COMMIT: 4817a174a7e481ee3c1407a0ecaceb4dc6d5f041
      BACKEND_TARGET: https://delta-mining-ops.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate identities and create isolated checkouts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DM_PERF_EMAIL" && test -n "$DM_PERF_PASSWORD"
          git fetch --no-tags origin "$BASELINE_COMMIT" "$CANDIDATE_COMMIT"
          git worktree add --detach ../phase1b-baseline "$BASELINE_COMMIT"
          git worktree add --detach ../phase1b-candidate "$CANDIDATE_COMMIT"
          baseline_tree="$(git -C ../phase1b-baseline rev-parse HEAD^{tree})"
          candidate_tree="$(git -C ../phase1b-candidate rev-parse HEAD^{tree})"
          test "$candidate_tree" = "8a53a8ae24d24b1d6887ae3b53b0c479ba05e467"
          test "$(git -C ../phase1b-candidate rev-parse HEAD^)" = "$CANDIDATE_FUNCTIONAL_BASE_COMMIT"
          test "$(git -C ../phase1b-candidate rev-parse HEAD^^)" = "$BASELINE_COMMIT"
          mkdir -p artifacts/phase1b-ab
          git -C ../phase1b-candidate diff --no-ext-diff --binary "$BASELINE_COMMIT".."$CANDIDATE_COMMIT" > artifacts/phase1b-ab/candidate.diff
          node -e 'const fs=require("fs");fs.writeFileSync("artifacts/phase1b-ab/traceability.json",JSON.stringify({baselineCommit:process.env.BASELINE_COMMIT,candidateCommit:process.env.CANDIDATE_COMMIT,candidateOriginalLocalCommit:process.env.CANDIDATE_ORIGINAL_LOCAL_COMMIT,candidateFunctionalBaseCommit:process.env.CANDIDATE_FUNCTIONAL_BASE_COMMIT,candidatePhase1BContentEquivalent:true,baselineTree:process.argv[1],candidateTree:process.argv[2],backendTarget:process.env.BACKEND_TARGET,frontendLocalUrls:["http://127.0.0.1:4173","http://127.0.0.1:4174"]},null,2))' "$baseline_tree" "$candidate_tree"
      - name: Build both exact frontends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase1b-ab
          for name in baseline candidate; do
            dir="../phase1b-$name"
            (cd "$dir" && npm ci && VITE_DM_PERF_DIAGNOSTICS=1 npm run build) 2>&1 | tee "artifacts/phase1b-ab/$name-build.log"
          done
      - name: Install browser runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run consecutive batteries through transparent proxy
        shell: bash
        run: |
          set -euo pipefail
          run_case(){ node scripts/phase1b-ab-proxy.mjs --root="$2" --port="$3" --backend="$BACKEND_TARGET" >/tmp/phase1b-proxy.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' RETURN; for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:$3/" >/dev/null && break; sleep 1; done; rm -rf artifacts/phase0; DM_PERF_BASE_URL="http://127.0.0.1:$3" DM_PERF_RUN_SLOW=1 node scripts/phase0-production-measurement.mjs; mkdir -p "artifacts/phase1b-ab/$1"; cp -R artifacts/phase0/. "artifacts/phase1b-ab/$1/"; kill "$pid" 2>/dev/null || true; trap - RETURN; }
          run_case baseline ../phase1b-baseline/dist 4173
          run_case candidate ../phase1b-candidate/dist 4174
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1b-local-ab-measurement
          path: artifacts/phase1b-ab/
          retention-days: 14

  phase1c-cpu-profile:
    name: Phase 1C baseline CPU profile
    if: ${{ inputs.mode == 'phase1c-cpu-profile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DM_PERF_EMAIL: ${{ secrets.DM_PERF_EMAIL }}
      DM_PERF_PASSWORD: ${{ secrets.DM_PERF_PASSWORD }}
      BASELINE_COMMIT: 26b07f0e54b00a1b83d8c31d0528d2481aa0a67c
      BACKEND_TARGET: https://delta-mining-ops.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the exact baseline frontend
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DM_PERF_EMAIL" && test -n "$DM_PERF_PASSWORD"
          git fetch --no-tags origin "$BASELINE_COMMIT"
          git worktree add --detach ../phase1c-baseline "$BASELINE_COMMIT"
          test "$(git -C ../phase1c-baseline rev-parse HEAD)" = "$BASELINE_COMMIT"
          (cd ../phase1c-baseline && npm ci && VITE_DM_PERF_DIAGNOSTICS=1 npm run build) 2>&1 | tee baseline-build.log
      - name: Install Chromium profiler runner
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Capture baseline CPU profiles through local frontend and proxy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase1b-ab-proxy.mjs --root=../phase1c-baseline/dist --port=4173 --backend="$BACKEND_TARGET" >/tmp/phase1c-proxy.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          DM_PERF_BASE_URL=http://127.0.0.1:4173 node scripts/phase1c-cpu-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1c-baseline-cpu-profile
          path: |
            artifacts/phase1c-cpu/
            baseline-build.log
          retention-days: 14
