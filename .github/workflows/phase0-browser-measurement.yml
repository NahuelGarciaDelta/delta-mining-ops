name: Phase 0 Performance Measurements

on:
  push:
    branches:
      - phase0-performance-measurement
    paths:
      - ".github/workflows/phase0-browser-measurement.yml"
      - "scripts/phase0-browser-measurement.mjs"
      - "scripts/phase0-bundle-metrics.mjs"
      - "src/services/performanceDiagnostics.js"
      - "src/services/refreshManager.js"
      - "scripts/phase0-performance-diagnostics-vite-plugin.mjs"
      - "vite.config.js"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: phase0-performance-measurements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-metrics:
    name: Bundle metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout instrumented branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build instrumented app
        env:
          VITE_DM_PERF_DIAGNOSTICS: "1"
        run: npm run build

      - name: Measure bundle and gzip sizes
        run: node scripts/phase0-bundle-metrics.mjs

      - name: Upload bundle metrics
        uses: actions/upload-artifact@v4
        with:
          name: phase0-bundle-metrics
          path: |
            artifacts/phase0/bundle-metrics.json
            artifacts/phase0/bundle-metrics.csv
          retention-days: 14

  browser-metrics:
    name: Browser cold warm and slow measurements
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DM_PERF_EMAIL: ${{ secrets.DM_PERF_EMAIL }}
      DM_PERF_PASSWORD: ${{ secrets.DM_PERF_PASSWORD }}
      DM_PERF_RUN_SLOW: "1"
    steps:
      - name: Checkout instrumented branch
        uses: actions/checkout@v4

      - name: Check measurement credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$DM_PERF_EMAIL" ] && [ -n "$DM_PERF_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Secrets de medición disponibles."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No se ejecutará navegación autenticada hasta configurar DM_PERF_EMAIL y DM_PERF_PASSWORD."
          fi

      - name: Resolve successful Vercel preview for this commit
        if: steps.credentials.outputs.available == 'true'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase0
          echo "Buscando deployment Vercel asociado a $GITHUB_SHA..."
          for attempt in $(seq 1 60); do
            deployments="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&per_page=20" 2>/dev/null || echo '[]')"
            ids="$(printf '%s' "$deployments" | jq -r '.[].id' 2>/dev/null || true)"
            for id in $ids; do
              statuses="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=20" 2>/dev/null || echo '[]')"
              candidate="$(printf '%s' "$statuses" | jq -r '[.[] | select(.state == "success" and (.environment_url // "") != "")][0].environment_url // empty' 2>/dev/null || true)"
              if [ -n "$candidate" ]; then
                candidate="${candidate%/}"
                echo "base_url=$candidate" >> "$GITHUB_OUTPUT"
                host="$(node -e 'try{console.log(new URL(process.argv[1]).host)}catch{console.log("invalid")}' "$candidate")"
                echo "Preview resuelto: $host"
                printf '%s\n' "$host" > artifacts/phase0/preview-host.txt
                exit 0
              fi
            done
            echo "Deployment todavía no disponible (intento $attempt/60)."
            sleep 5
          done
          echo "No se pudo resolver un deployment exitoso con environment_url para este commit." | tee artifacts/phase0/preview-resolution-error.txt
          exit 1

      - name: Verify preview is reachable
        if: steps.credentials.outputs.available == 'true'
        env:
          DM_PERF_BASE_URL: ${{ steps.preview.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/phase0-preview.html -w '%{http_code}' "${DM_PERF_BASE_URL}/?dmPerf=1")"
          echo "Preview HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "El preview no es accesible desde GitHub Actions (HTTP $code)." | tee artifacts/phase0/preview-access-error.txt
            exit 1
          fi

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      - name: Install Playwright runner without changing repository lockfile
        if: steps.credentials.outputs.available == 'true'
        run: npm install --no-save --package-lock=false playwright@1.49.1

      - name: Install Chromium
        if: steps.credentials.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated performance battery against Vercel preview
        if: steps.credentials.outputs.available == 'true'
        env:
          DM_PERF_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: node scripts/phase0-browser-measurement.mjs

      - name: Record why browser battery was skipped
        if: steps.credentials.outputs.available != 'true'
        shell: bash
        run: |
          mkdir -p artifacts/phase0
          cat > artifacts/phase0/browser-measurement-skipped.txt <<'EOF'
          La batería autenticada de Fase 0 no se ejecutó porque el repositorio todavía no tiene disponibles los GitHub Actions Secrets DM_PERF_EMAIL y DM_PERF_PASSWORD.
          No se requieren ni deben guardarse credenciales dentro del código o de los artifacts.
          EOF

      - name: Upload browser metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-browser-metrics
          path: artifacts/phase0/
          if-no-files-found: warn
          retention-days: 14
