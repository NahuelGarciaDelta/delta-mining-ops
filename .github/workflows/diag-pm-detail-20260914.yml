name: Diagnose PM detail source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-pm-detail-20260914.yml'
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate labels and PM calculations
        run: |
          echo '=== DETALLE DE EQUIPO ==='
          grep -RniE 'DETALLE DE EQUIPO|Detalle de equipo|detalle de equipo' src || true
          echo '=== ULTIMO PM ==='
          grep -RniE 'Último PM|ULTIMO PM|Ultimo PM|horometroUltimoPM' src | head -200 || true
          echo '=== PROXIMO PM ==='
          grep -RniE 'Próximo PM|PROXIMO PM|Proximo PM|proximoPM' src | head -200 || true
          echo '=== HOROMETRO ACTUAL ==='
          grep -RniE 'Horómetro actual|HOROMETRO ACTUAL|Horometro actual|horometroActual' src | head -200 || true
