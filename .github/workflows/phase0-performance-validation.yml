name: Phase 0 Performance Validation

on:
  push:
    branches:
      - phase0-performance-measurement
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-performance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build
