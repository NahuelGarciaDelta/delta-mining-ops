name: Phase 1C A B Measurement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1c-ab-measurement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1c-local-ab:
    name: Phase 1C local frontend A B
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DM_PERF_EMAIL: ${{ secrets.DM_PERF_EMAIL }}
      DM_PERF_PASSWORD: ${{ secrets.DM_PERF_PASSWORD }}
      BASELINE_COMMIT: 26b07f0e54b00a1b83d8c31d0528d2481aa0a67c
      CANDIDATE_COMMIT: 0b35e53efbee6ab8019ddef3ed955ccfd8391de5
      BACKEND_TARGET: https://delta-mining-ops.vercel.app
    steps:
      - name: Checkout harness branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate identities and build exact frontends
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DM_PERF_EMAIL"
          test -n "$DM_PERF_PASSWORD"
          git fetch --no-tags origin "$BASELINE_COMMIT" "$CANDIDATE_COMMIT"
          git worktree add --detach ../phase1c-baseline "$BASELINE_COMMIT"
          git worktree add --detach ../phase1c-candidate "$CANDIDATE_COMMIT"
          test "$(git -C ../phase1c-baseline rev-parse HEAD)" = "$BASELINE_COMMIT"
          test "$(git -C ../phase1c-candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C ../phase1c-candidate rev-parse HEAD^)" = "$BASELINE_COMMIT"
          test "$(git -C ../phase1c-candidate rev-list --count "$BASELINE_COMMIT..$CANDIDATE_COMMIT")" = 1
          test "$(git -C ../phase1c-candidate diff --name-only "$BASELINE_COMMIT..$CANDIDATE_COMMIT")" = "src/shared/domain/index.jsx"
          mkdir -p artifacts/phase1c-ab
          git -C ../phase1c-candidate diff --binary "$BASELINE_COMMIT..$CANDIDATE_COMMIT" > artifacts/phase1c-ab/candidate.diff
          node -e 'const fs=require("fs"),cp=require("child_process");fs.writeFileSync("artifacts/phase1c-ab/traceability.json",JSON.stringify({baselineCommit:process.env.BASELINE_COMMIT,candidateCommit:process.env.CANDIDATE_COMMIT,baselineTree:cp.execFileSync("git",["-C","../phase1c-baseline","rev-parse","HEAD^{tree}"],{encoding:"utf8"}).trim(),candidateTree:cp.execFileSync("git",["-C","../phase1c-candidate","rev-parse","HEAD^{tree}"],{encoding:"utf8"}).trim(),backendTarget:process.env.BACKEND_TARGET},null,2))'
          for n in baseline candidate; do
            (cd "../phase1c-$n" && npm ci && VITE_DM_PERF_DIAGNOSTICS=1 npm run build) 2>&1 | tee "artifacts/phase1c-ab/$n-build.log"
          done

      - name: Install browser runner
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright@1.49.1
          npx playwright install --with-deps chromium
          node --check scripts/phase1c-summarize-ab.mjs

      - name: Run five ordered A B pairs
        shell: bash
        run: |
          set -euo pipefail
          run_case() {
            local label="$1"
            local root="$2"
            local port="$3"
            local out="$4"
            local pid code ready valid
            mkdir -p "$out"
            rm -rf artifacts/phase0
            valid=false
            ready=false
            node scripts/phase1b-ab-proxy.mjs --root="$root" --port="$port" --backend="$BACKEND_TARGET" >"$out/proxy.log" 2>&1 &
            pid=$!
            cleanup() { kill "$pid" 2>/dev/null || true; }
            trap cleanup RETURN
            for _ in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" = true ]; then
              set +e
              DM_PERF_BASE_URL="http://127.0.0.1:$port" DM_PERF_RUN_SLOW=1 node scripts/phase0-production-measurement.mjs >"$out/runner.log" 2>&1
              code=$?
              set -e
              if [ "$code" = 0 ]; then valid=true; fi
            else
              code=125
              echo 'proxy unavailable' >"$out/runner.log"
            fi
            if [ -d artifacts/phase0 ]; then cp -R artifacts/phase0/. "$out/"; fi
            echo "$code" >"$out/exit-code.txt"
            echo "valid=$valid" >"$out/valid.txt"
            cleanup
            trap - RETURN
            return 0
          }

          for i in 1 2 3 4 5; do
            run_case baseline ../phase1c-baseline/dist 4173 "artifacts/phase1c-ab/pair-$i/baseline"
            run_case candidate ../phase1c-candidate/dist 4174 "artifacts/phase1c-ab/pair-$i/candidate"
            if grep -qx 'valid=true' "artifacts/phase1c-ab/pair-$i/baseline/valid.txt" && grep -qx 'valid=true' "artifacts/phase1c-ab/pair-$i/candidate/valid.txt"; then
              echo true >"artifacts/phase1c-ab/pair-$i/pair-valid.txt"
            else
              echo false >"artifacts/phase1c-ab/pair-$i/pair-valid.txt"
            fi
          done

      - name: Summarize Phase 1C A B pairs
        run: node scripts/phase1c-summarize-ab.mjs artifacts/phase1c-ab

      - name: Upload Phase 1C A B measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-local-ab-measurement
          path: artifacts/phase1c-ab/
          if-no-files-found: warn
          retention-days: 14
